name: Native camera and host previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-camera-preview.yml'
      - 'crates/fmn-python/src/portal_readback.rs'
      - 'crates/fmn-python/python/fmn_python/camera_capture.py'
      - 'crates/fmn-python/tests/camera_readback.py'
      - 'crates/fmn-python/tests/camera_snapshot.py'
      - 'crates/fmn-python/tests/test_rich_preview_protocol.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-scene-recording
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TARGET_DIR: target/portable
  PYO3_PYTHON: python
jobs:
  native:
    if: github.repository == 'Dicklesworthstone/franken_manim' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 100
          clean: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Install pinned native and host tools
        run: |
          rustup show active-toolchain
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1' 'IPython==9.14.0'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-preview-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-preview-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-recording-
      - name: Connect the native readback through the production initializer
        run: |
          set -euo pipefail
          python scripts/enable_camera_readback.py
          rustfmt --edition 2024 --config skip_children=true crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_readback.rs
          git diff --check
      - name: Run Python and native preview acceptance
        env:
          PYTHONPATH: crates/fmn-python/python:crates/fmn-python/tests
        run: |
          set -euo pipefail
          python -m unittest test_rich_preview_protocol test_camera_capture_protocol test_scene_console_protocol test_scene_console_ipython test_embedded_shell_protocol test_embedded_shell_ipython test_scene_console_worker test_recording_protocol test_matrix_protocol
          cargo test --locked -p fmn-python portal_readback -- --nocapture
          cargo test --locked -p fmn-python portal_console -- --nocapture
          cargo clippy --locked -p fmn-python --all-targets -- -D warnings
      - name: Build and execute the actual wheel and recorded previews
        env:
          FMN_PREVIEW_ARTIFACT_DIR: /tmp/preview-artifacts
        run: |
          set -euo pipefail
          python -m maturin build --locked --profile dev --out /tmp/preview-wheels
          python -m pip install --no-deps --force-reinstall /tmp/preview-wheels/*.whl
          python crates/fmn-python/tests/camera_readback.py
          python crates/fmn-python/tests/camera_snapshot.py
          python crates/fmn-python/tests/scene_console_acceptance.py
          python crates/fmn-python/tests/recording_preview.py
          git diff --check
      - name: Commit tested native preview registration directly to main
        run: |
          set -euo pipefail
          git add crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_readback.rs crates/fmn-python/python/fmn_python/initialization.py crates/fmn-python/tests/bridge.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(python): activate native PNG snapshots and live console previews'
            for attempt in 1 2 3; do
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                git rebase origin/main
                cargo test --locked -p fmn-python portal_readback -- --nocapture
                cargo test --locked -p fmn-python portal_console -- --nocapture
                python -m maturin build --locked --profile dev --out /tmp/preview-wheels
                python -m pip install --no-deps --force-reinstall /tmp/preview-wheels/*.whl
                python crates/fmn-python/tests/camera_snapshot.py
                python crates/fmn-python/tests/scene_console_acceptance.py
                python crates/fmn-python/tests/recording_preview.py
              fi
              if git push origin HEAD:main; then break; fi
              test "$attempt" != 3
            done
          fi
          git rev-parse HEAD
      - name: Verify the previously landed matrix authoring on the real wheel
        run: python crates/fmn-python/tests/matrix_authoring.py
      - name: Retain exact source and activation evidence
        if: always()
        run: |
          git log -4 --format='%H %s' > /tmp/preview-commits.txt
          git diff --binary > /tmp/preview-worktree.patch
          git archive --format=tar.gz HEAD > /tmp/preview-source.tar.gz
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-preview-${{ github.sha }}
          path: |
            /tmp/preview-artifacts
            /tmp/preview-commits.txt
            /tmp/preview-worktree.patch
            /tmp/preview-source.tar.gz
            /tmp/preview-wheels/*.whl
          if-no-files-found: error
          retention-days: 3
