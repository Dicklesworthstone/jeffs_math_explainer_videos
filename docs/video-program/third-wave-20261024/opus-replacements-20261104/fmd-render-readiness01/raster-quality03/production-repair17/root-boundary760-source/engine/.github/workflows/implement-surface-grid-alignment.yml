name: Implement native UV grid alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/implement-surface-grid-alignment.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: implement-native-surface-grid
  cancel-in-progress: false
jobs:
  implement:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Apply exact reviewed implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, pathlib
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '88a52e5abffd4304b48099fa494a98f9a30a2592d50089733c7f227bfa2b339a'
          pathlib.Path('/tmp/native-surface-grid.patch').write_bytes(patch)
          PY
          git apply --check /tmp/native-surface-grid.patch
          git apply /tmp/native-surface-grid.patch
          rustfmt --edition 2024 crates/fmn-mobject/src/surface_grid.rs crates/fmn-mobject/tests/surface_grid.rs crates/fmn-anim/tests/surface_grid_alignment.rs
          git diff --check
      - name: Test native alignment and its downstream portal build
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-mobject -p fmn-anim 2>&1 | tee /tmp/native-surface-grid-tests.log
          cargo clippy --locked -p fmn-mobject -p fmn-anim --all-targets -- -D warnings 2>&1 | tee /tmp/native-surface-grid-clippy.log
          cargo check --locked -p fmn-python 2>&1 | tee /tmp/native-surface-grid-portal-check.log
      - name: Commit tested native implementation directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/surface-geometry.yml crates/fmn-mobject/src/align.rs crates/fmn-mobject/src/lib.rs crates/fmn-mobject/src/stage.rs crates/fmn-mobject/src/surface_grid.rs crates/fmn-mobject/tests/surface_grid.rs crates/fmn-anim/tests/surface_grid_alignment.rs
          git commit -m 'feat(surface): align native UV topology and complete records before morphs (fm-5wq.4.143)' -m 'Use bounded two-dimensional record interpolation rather than flat resizing. Preserve normal control points, UVs, custom fields, materials, placement, live-view generations, snapshots and target identity. Thirteen new native cases cover topology, temporal interpolation, ownership and refusals. Native mobject/animation tests, Clippy and the portal compilation passed before publication.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            cargo test --locked -p fmn-mobject -p fmn-anim
            cargo clippy --locked -p fmn-mobject -p fmn-anim --all-targets -- -D warnings
            cargo check --locked -p fmn-python
          done
          exit 1
      - name: Preserve exact source and evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/native-surface-grid-source-sha.txt
          git diff > /tmp/native-surface-grid-working.patch
          git archive --format=tar.gz HEAD > /tmp/native-surface-grid-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-surface-grid-${{ github.run_id }}
          path: /tmp/native-surface-grid-*
          retention-days: 3
