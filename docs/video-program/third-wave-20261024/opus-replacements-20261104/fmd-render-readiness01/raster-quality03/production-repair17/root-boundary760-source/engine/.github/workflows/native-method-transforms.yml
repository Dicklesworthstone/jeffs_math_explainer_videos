name: Native method transforms
on:
  push:
    branches: [main]
    paths:
      - 'scripts/activate_native_method_transforms.py'
      - '.github/workflows/native-method-transforms.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-method-transforms
  cancel-in-progress: false
jobs:
  native-method-transforms:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: target/scribe
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Activate the shared native Transform implementation
        run: |
          set -euo pipefail
          if ! grep -Fq 'mod method_animation;' crates/fmn-anim/src/animation.rs; then
            python3 scripts/activate_native_method_transforms.py
            python3 scripts/activate_native_method_transforms.py
          fi
          rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/scribe
          key: cargo-${{ runner.os }}-${{ runner.arch }}-methods-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-scribe-
      - name: Format and test complete native animation and scene suites
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true \
            crates/fmn-anim/src/animation.rs crates/fmn-anim/src/method_animation.rs \
            crates/fmn-anim/tests/animation.rs crates/fmn-anim/tests/method_transform.rs \
            crates/fmn-mobject/src/animate.rs crates/fmn-scene/src/timeline_bundle.rs \
            crates/fmn-scene/tests/method_bundle.rs
          cargo test --locked -p fmn-mobject -p fmn-anim -p fmn-scene --all-targets 2>&1 | tee /tmp/native-method-tests.log
          cargo clippy --locked -p fmn-mobject -p fmn-anim -p fmn-scene --all-targets -- -D warnings 2>&1 | tee /tmp/native-method-clippy.log
          git diff --check
      - name: Commit verified functionality directly to main
        run: |
          set -euo pipefail
          git add crates/fmn-anim/src/animation.rs crates/fmn-anim/src/method_animation.rs \
            crates/fmn-anim/tests/animation.rs crates/fmn-anim/tests/method_transform.rs \
            crates/fmn-mobject/src/animate.rs crates/fmn-scene/src/timeline_bundle.rs \
            crates/fmn-scene/tests/method_bundle.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(anim): complete native method transforms, family alignment and arc replay'
            git push origin HEAD:main
          fi
          git rev-parse HEAD | tee /tmp/native-method-head.txt
      - name: Preserve validation evidence
        if: always()
        run: |
          git diff > /tmp/native-method-working.patch
          git archive --format=tar.gz HEAD > /tmp/native-method-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-method-transforms-${{ github.sha }}
          path: /tmp/native-method-*
          retention-days: 1
