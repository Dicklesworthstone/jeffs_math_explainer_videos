name: API schema class namespace repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-schema-class-namespace-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-schema-class-namespace-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target/api-schema-repair
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final-class-namespace repair
        env:
          PATCH_GZ_B64: ''
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/api-schema-repair.patch"
          git apply --check "$RUNNER_TEMP/api-schema-repair.patch"
          git apply "$RUNNER_TEMP/api-schema-repair.patch"
          python3 -m py_compile scripts/gen_api_schema.py scripts/test_gen_api_schema.py
          PYTHONPATH=scripts python3 scripts/test_gen_api_schema.py
          python3 scripts/check_python_helper_aliases.py
          python3 scripts/test_python_helper_aliases.py
          python3 scripts/check_library_constructor_authority.py
          python3 scripts/test_library_constructor_authority.py

      - name: Regenerate schema-derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_API_ARTIFACTS=1 cargo test --locked -p fmn-conformance --test api_schema
          cargo test --locked -p fmn-conformance --test api_schema
          cargo fmt --all -- --check
          git diff --check
          test -z "$(git diff --name-only --diff-filter=D)"

      - name: Install Ultimate Bug Scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A "OpenAI File Downloader, XaiImageApiFetch/1.0" \
            https://raw.githubusercontent.com/Dicklesworthstone/ultimate_bug_scanner/main/install.sh \
            -o "$RUNNER_TEMP/install-ubs.sh"
          bash "$RUNNER_TEMP/install-ubs.sh" \
            --non-interactive \
            --no-path-modify \
            --skip-hooks \
            --install-dir "$RUNNER_TEMP/ubs-bin"
          "$RUNNER_TEMP/ubs-bin/ubs" --version

      - name: Commit and push semantic repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jeff Emanuel"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"
          git add -A
          git diff --cached --check
          mapfile -t changed_files < <(git diff --cached --name-only --diff-filter=ACMR)
          test "${#changed_files[@]}" -gt 0
          "$RUNNER_TEMP/ubs-bin/ubs" "${changed_files[@]}"
          git commit \
            -m "fix(schema): model final Python class namespaces" \
            -m "Collapse transient class-body definitions under Python's last-binding-wins semantics, preserve property setter identity, remove the duplicate VMobject.rotate symbol and parameter rows, advance the reviewed-ledger ratchet, and regenerate every dependent artifact. The mandatory gate now locks the extractor regression before helper-policy validation." \
            -m "Relates-to: fm-5wq.4.141"
          git pull --rebase origin main
          PYTHONPATH=scripts python3 scripts/test_gen_api_schema.py
          python3 scripts/check_python_helper_aliases.py
          cargo test --locked -p fmn-conformance --test api_schema
          git push origin HEAD:main
