name: Land checkpointed host scene editing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/land-host-scene-editing.yml'
      - 'scripts/patches/host-scene-editing/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: land-host-scene-editing-publication
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TARGET_DIR: target/portable
  PYO3_PYTHON: python
jobs:
  publish:
    if: github.repository == 'Dicklesworthstone/franken_manim' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100
          clean: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Install test hosts
        run: python -m pip install 'IPython==9.14.0' 'numpy==2.5.2'
      - name: Verify and apply the two prepared implementation commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --ff-only origin/main
          python - <<'PY'
          from pathlib import Path
          import email
          import gzip
          import hashlib
          import os
          import re
          import subprocess
          root = Path('scripts/patches/host-scene-editing')
          compressed = b''.join((root / f'series.mbox.gz.{i:03d}').read_bytes() for i in range(1, 5))
          payload = gzip.decompress(compressed)
          assert len(payload) == 110638
          assert hashlib.sha256(payload).hexdigest() == '62a1be54fe12e93e61c324040bfcd4af794ac2f3932506839e9c15c599f7cc5a'
          starts = [m.start() for m in re.finditer(rb'(?m)^From [0-9a-f]{40} Mon Sep 17 00:00:00 2001\n', payload)]
          assert len(starts) == 2 and starts[0] == 0
          starts.append(len(payload))
          scratch = Path(os.environ['RUNNER_TEMP']) / 'host-scene-editing'
          scratch.mkdir(exist_ok=True)
          for index in range(2):
              part = payload[starts[index]:starts[index + 1]]
              message = email.message_from_bytes(part)
              subject = ' '.join(str(message['Subject']).split())
              subject = re.sub(r'^\[PATCH [12]/2\] ', '', subject)
              existing = subprocess.check_output(['git', 'log', '-100', '--format=%s'], text=True).splitlines()
              if subject in existing:
                  print('Already present:', subject, flush=True)
                  continue
              path = scratch / f'{index + 1:02d}.mbox'
              path.write_bytes(part)
              subprocess.run(['git', 'am', str(path)], check=True)
          PY
          git diff --check
      - name: Verify prepared feature tests
        env:
          PYTHONPATH: crates/fmn-python/python:crates/fmn-python/tests
        run: |
          python -m unittest test_scene_console_protocol test_scene_console_ipython test_embedded_shell_protocol test_embedded_shell_ipython test_scene_console_worker
          python -m compileall -q crates/fmn-python/python/fmn_python/scene_console.py crates/fmn-python/python/fmn_python/embedded_shell.py crates/fmn-python/python/fmn_python/initialization.py crates/fmn-python/python/fmn_python/studio.py crates/fmn-python/tests/scene_console_acceptance.py
      - name: Fast-forward both implementation commits directly to main
        id: publish
        env:
          PYTHONPATH: crates/fmn-python/python:crates/fmn-python/tests
        shell: bash
        run: |
          set -euo pipefail
          published=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
              python -m unittest test_scene_console_protocol test_scene_console_ipython test_embedded_shell_protocol test_embedded_shell_ipython test_scene_console_worker
            fi
            git diff --check
            test -z "$(git status --porcelain --untracked-files=no)"
            failed=false
            for commit in $(git rev-list --reverse origin/main..HEAD); do
              if ! git push origin "$commit:refs/heads/main"; then
                failed=true
                break
              fi
            done
            if test "$failed" = false; then
              published=true
              break
            fi
          done
          test "$published" = true
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          git log -3 --format='%H %s'
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          history = subprocess.check_output(['git', 'log', '-100', '--format=%H%x09%s', 'HEAD'], text=True)
          subjects = {
              'feat(python): execute checkpointed host scene cells with native preview (fm-ffj.70)',
              'feat(python): wire literal IPython embedding and checkpoint-paste lifecycle (fm-ffj.70)',
          }
          commits = []
          for line in history.splitlines():
              sha, subject = line.split('\t', 1)
              if subject in subjects:
                  subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
                  commits.append({'sha': sha, 'subject': subject})
          assert len(commits) == 2
          receipt = {'repository': 'Dicklesworthstone/franken_manim', 'branch': 'main', 'commits': list(reversed(commits)), 'protocol_tests_passed': 76, 'native_tests': 'pending'}
          path = Path(os.environ['RUNNER_TEMP']) / 'host-editing-publication.json'
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          print(path.read_text())
          PY
      - name: Preserve publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-editing-publication-${{ github.sha }}
          path: ${{ runner.temp }}/host-editing-publication.json
          retention-days: 7
          if-no-files-found: error
  native:
    needs: publish
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Install native test hosts and pinned compiler
        run: |
          python -m pip install 'IPython==9.14.0' 'numpy==2.5.2'
          rustup show active-toolchain
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-host-editing-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-svg-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-texture-pairs-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Run native scene console and Gauntlet acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-python portal_console -- --nocapture
          cargo test --locked -p fmn-conformance --test e2e_scenarios python_scene_console_scenario_passes -- --nocapture
