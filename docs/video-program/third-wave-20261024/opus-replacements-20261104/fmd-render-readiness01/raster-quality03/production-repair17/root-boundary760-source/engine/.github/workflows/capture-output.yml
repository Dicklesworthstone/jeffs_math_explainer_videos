name: Native capture and paired output
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-output.yml'
      - 'crates/fmn-python/src/portal_readback.rs'
      - 'crates/fmn-python/src/portal_capture_output.rs'
      - 'crates/fmn-python/python/fmn_python/camera_capture.py'
      - 'crates/fmn-python/python/fmn_python/paired_output.py'
      - 'crates/fmn-python/python/fmn_python/rendering.py'
      - 'crates/fmn-python/python/fmn_python/batch_rendering.py'
      - 'crates/fmn-python/python/fmn_python/console_rendering.py'
      - 'crates/fmn-python/tests/capture_output.py'
      - 'crates/fmn-python/tests/paired_output.py'
      - 'crates/fmn-python/tests/paired_output_cli.py'
      - 'crates/fmn-python/tests/test_paired_output_protocol.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capture-output
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Build the exact published wheel
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
          python -m maturin build --locked --interpreter python --profile dev --out target/capture-output-wheel 2>&1 | tee /tmp/capture-output-build.log
          python -m venv target/capture-output-venv
          target/capture-output-venv/bin/python -m pip install 'numpy==2.5.2' target/capture-output-wheel/*.whl
      - name: Run native publication and existing output acceptance
        run: |
          set -euo pipefail
          for suite in capture_output paired_output paired_output_cli camera_snapshot camera_readback programmatic_rendering portal_initialization batch_rendering configured_subdivision reproducible_batch batch_checkpoint_acceptance; do
            target/capture-output-venv/bin/python -I crates/fmn-python/tests/$suite.py 2>&1 | tee /tmp/capture-output-$suite.log
          done
          target/capture-output-venv/bin/python -I crates/fmn-python/tests/test_paired_output_protocol.py 2>&1 | tee /tmp/capture-output-protocol.log
          cargo test --locked -p fmn-python --lib portal_readback:: -- --nocapture 2>&1 | tee /tmp/capture-output-embedded.log
          cargo clippy --locked -p fmn-python --lib -- -D warnings 2>&1 | tee /tmp/capture-output-clippy.log
      - name: Preserve exact source and test evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/capture-output-source-sha.txt
          git diff > /tmp/capture-output-working.patch
          git archive --format=tar.gz HEAD > /tmp/capture-output-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capture-output-${{ github.sha }}
          path: |
            /tmp/capture-output-*
            target/capture-output-wheel/*.whl
          retention-days: 3
