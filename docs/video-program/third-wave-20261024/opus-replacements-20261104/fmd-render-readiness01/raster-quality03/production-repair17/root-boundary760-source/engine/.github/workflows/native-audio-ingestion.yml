name: Native audio ingestion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-audio-ingestion.yml'
      - 'crates/fmn-output/src/audio.rs'
      - 'crates/fmn-output/src/ffmpeg/audio.rs'
      - 'crates/fmn-output/tests/audio.rs'
      - 'crates/fmn-output/tests/make_audio_fixtures.py'
      - 'scripts/patches/native-audio-ingestion.patch'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-audio-ingestion
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture exact source for portal integration
        run: |
          git archive --format=tar.gz HEAD > /tmp/audio-source.tar.gz
          git rev-parse HEAD > /tmp/audio-source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audio-source-${{ github.sha }}
          path: |
            /tmp/audio-source.tar.gz
            /tmp/audio-source-sha.txt
          retention-days: 1
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: target/portable
      CARGO_TERM_COLOR: always
      FMN_AUDIO_FIXTURE_DIR: ${{ github.workspace }}/target/audio-fixtures
      FMN_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Connect native audio ingestion
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qx 'pub mod audio;' crates/fmn-output/src/lib.rs; then
            git apply --check scripts/patches/native-audio-ingestion.patch
            git apply scripts/patches/native-audio-ingestion.patch
          fi
      - name: Install pinned compiler and test-only encoder
        run: |
          rustup show active-toolchain
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-
      - name: Test real compressed inputs and native PCM contracts
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true crates/fmn-output/src/lib.rs crates/fmn-output/src/ffmpeg.rs crates/fmn-output/src/audio.rs crates/fmn-output/src/ffmpeg/audio.rs crates/fmn-output/tests/audio.rs
          python crates/fmn-output/tests/make_audio_fixtures.py "$FMN_AUDIO_FIXTURE_DIR"
          cargo test --locked -p fmn-output audio -- --nocapture
          cargo clippy --locked -p fmn-output --lib -- -D warnings
          git diff --check
      - name: Commit tested audio engine directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add crates/fmn-output/src/lib.rs crates/fmn-output/src/ffmpeg.rs crates/fmn-output/src/audio.rs crates/fmn-output/src/ffmpeg/audio.rs crates/fmn-output/tests/audio.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(output): activate verified native-first compressed sound decoding'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
      - name: Package exact tested source
        if: success()
        run: |
          git archive --format=tar.gz HEAD > /tmp/audio-tested-source.tar.gz
          git rev-parse HEAD > /tmp/audio-tested-source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: audio-tested-source-${{ github.sha }}
          path: |
            /tmp/audio-tested-source.tar.gz
            /tmp/audio-tested-source-sha.txt
          retention-days: 1
