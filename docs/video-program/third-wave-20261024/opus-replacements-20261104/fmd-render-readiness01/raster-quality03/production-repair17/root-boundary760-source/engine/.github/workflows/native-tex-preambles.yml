name: Native Tex preambles and templates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-tex-preambles.yml'
      - 'scripts/patches/tex-*-preambles.patch'
      - 'crates/fmn-python/tests/tex_preambles.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-tex-preambles
  cancel-in-progress: false
jobs:
  preambles:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: target/portable
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Apply native typesetting and portal implementations
        run: |
          set -euo pipefail
          if ! grep -q 'pub fn typeset_with_preamble' crates/fmn-tex/src/engine.rs; then
            git apply --check scripts/patches/tex-native-preambles.patch
            git apply scripts/patches/tex-native-preambles.patch
          fi
          if ! grep -q 'mod portal_tex;' crates/fmn-python/src/lib.rs; then
            git apply --check scripts/patches/tex-portal-preambles.patch
            git apply scripts/patches/tex-portal-preambles.patch
          fi
          python -m py_compile crates/fmn-python/python/manimlib_bootstrap.py crates/fmn-python/tests/tex_preambles.py
      - name: Install pinned development tools
        run: |
          rustup show active-toolchain
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-tex-preambles-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-tex-preambles-
            cargo-${{ runner.os }}-${{ runner.arch }}-surface-mesh-
            cargo-${{ runner.os }}-${{ runner.arch }}-editing-
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-
      - name: Test native parser integration and original-source spans
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true crates/fmn-tex/src/lib.rs crates/fmn-tex/src/engine.rs crates/fmn-tex/src/preamble.rs crates/fmn-tex/tests/preambles.rs crates/fmn-library/src/tex.rs crates/fmn-library/tests/tex_preambles.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_tex.rs crates/fmn-conformance/tests/e2e_scenarios.rs
          cargo test --locked -p fmn-tex 2>&1 | tee /tmp/tex-preambles-native.log
          cargo test --locked -p fmn-library --test tex_preambles 2>&1 | tee /tmp/tex-preambles-library.log
          PYTHONPATH="$PWD/crates/fmn-python/python" cargo test --locked -p fmn-python production_tex_preambles_acceptance_suite -- --nocapture 2>&1 | tee /tmp/tex-preambles-portal.log
          grep -E 'test result: ok\. [1-9][0-9]* passed' /tmp/tex-preambles-portal.log
      - name: Verify installed wheel against independently expanded formulas
        run: |
          set -euo pipefail
          python -m maturin build --locked --interpreter python --profile dev --out target/tex-preambles-wheel
          python -m venv target/tex-preambles-venv
          target/tex-preambles-venv/bin/python -m pip install 'numpy==2.5.2' target/tex-preambles-wheel/*.whl
          target/tex-preambles-venv/bin/python -I crates/fmn-python/tests/tex_preambles.py 2>&1 | tee /tmp/tex-preambles-wheel.log
          target/tex-preambles-venv/bin/python -I crates/fmn-python/tests/matching_transform_semantics.py 2>&1 | tee /tmp/tex-preambles-matching.log
          target/tex-preambles-venv/bin/python -I crates/fmn-python/tests/surface_mesh.py 2>&1 | tee /tmp/tex-preambles-surface.log
          target/tex-preambles-venv/bin/python -I crates/fmn-python/tests/callback_cleanup.py 2>&1 | tee /tmp/tex-preambles-callback.log
      - name: Run native rendering Gauntlet and strict lint gate
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/crates/fmn-python/python" cargo test --locked -p fmn-conformance --test e2e_scenarios python_tex_preambles_scenario_passes -- --nocapture 2>&1 | tee /tmp/tex-preambles-gauntlet.log
          cargo clippy --locked -p fmn-tex -p fmn-library -p fmn-python --lib -- -D warnings 2>&1 | tee /tmp/tex-preambles-clippy.log
          git diff --check
      - name: Commit tested production code directly to main
        run: |
          set -euo pipefail
          git add crates/fmn-tex/src/lib.rs crates/fmn-tex/src/engine.rs crates/fmn-tex/src/preamble.rs crates/fmn-tex/tests/preambles.rs crates/fmn-library/src/tex.rs crates/fmn-library/tests/tex_preambles.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_tex.rs crates/fmn-python/python/manimlib_bootstrap.py crates/fmn-python/tests/tex_preambles.py crates/fmn-conformance/tests/e2e_scenarios.rs docs/behavior_notes/BN-05-native-text-typesetting.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(tex): enable native document preambles and named templates with source-span fidelity'
            git push origin HEAD:main
          fi
      - name: Run broader library regression without masking failures
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-library 2>&1 | tee /tmp/tex-preambles-library-all.log
      - name: Preserve exact source and execution evidence
        if: always()
        run: |
          git archive --format=tar.gz HEAD > /tmp/tex-preambles-source.tar.gz
          git rev-parse HEAD > /tmp/tex-preambles-source-sha.txt
          git diff > /tmp/tex-preambles-working.patch
          tar -czf /tmp/tex-preambles-working-source.tar.gz crates/fmn-tex crates/fmn-library/src/tex.rs crates/fmn-library/tests/tex_preambles.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_tex.rs crates/fmn-python/python/manimlib_bootstrap.py crates/fmn-python/tests/tex_preambles.py crates/fmn-conformance/tests/e2e_scenarios.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tex-preambles-${{ github.sha }}
          path: |
            /tmp/tex-preambles-*
            target/tex-preambles-wheel/*.whl
          retention-days: 2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-tex-preambles-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
