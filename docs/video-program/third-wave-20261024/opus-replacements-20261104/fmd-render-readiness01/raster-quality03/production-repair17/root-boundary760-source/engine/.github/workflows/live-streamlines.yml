name: Native live streamlines
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-streamlines.yml'
      - 'scripts/patches/live-streamlines.patch'
      - 'crates/fmn-python/src/portal_streamlines.rs'
      - 'crates/fmn-library/tests/live_streamlines.rs'
      - 'crates/fmn-python/python/fmn_python/streamlines.py'
      - 'crates/fmn-python/tests/live_streamlines.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-streamlines
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Apply reviewed native source changes
        run: |
          set -euo pipefail
          if ! grep -q '^mod portal_streamlines;' crates/fmn-python/src/lib.rs; then
            git apply --check scripts/patches/live-streamlines.patch
            git apply scripts/patches/live-streamlines.patch
          fi
          # Activate only in this tested candidate, alongside its native ABI.
          # The verified-source commit publishes both together, not a wheel
          # that fails import while waiting for its binding to land.
          python - <<'PYCODE'
          from pathlib import Path
          adapter = Path("crates/fmn-python/python/fmn_python/streamlines.py")
          if adapter.exists():
              path = adapter.with_name("initialization.py")
              text = path.read_text()
              anchor = '    ("streamline_rebuild", "install_streamline_rebuild"),'
              addition = '    ("streamlines", "install_streamlines"),'
              if addition not in text:
                  assert text.count(anchor) == 1
                  path.write_text(text.replace(anchor, anchor + "\n" + addition))
          PYCODE
          rustup show active-toolchain
          rustfmt --edition 2024 --config skip_children=true crates/fmn-library/src/fields.rs crates/fmn-library/tests/live_streamlines.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_streamlines.rs
          git diff --check
      - name: Native library seed and integration contracts
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-library --test live_streamlines 2>&1 | tee /tmp/live-streamlines-library.log
          cargo test --locked -p fmn-library --lib fields::tests::stream_lines 2>&1 | tee /tmp/live-streamlines-regression.log
      - name: Build and exercise the installed wheel
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
          python -m maturin build --locked --interpreter python --profile dev --out target/streamlines-wheel 2>&1 | tee /tmp/live-streamlines-build.log
          python -m venv target/streamlines-venv
          target/streamlines-venv/bin/python -m pip install 'numpy==2.5.2' target/streamlines-wheel/*.whl
          if test -f crates/fmn-python/tests/live_streamlines.py; then
            target/streamlines-venv/bin/python -I crates/fmn-python/tests/live_streamlines.py 2>&1 | tee /tmp/live-streamlines-acceptance.log
          fi
          target/streamlines-venv/bin/python -I crates/fmn-python/tests/streamline_rebuild.py 2>&1 | tee /tmp/live-streamlines-rebuild.log
          target/streamlines-venv/bin/python -I crates/fmn-python/tests/streamline_authoring.py 2>&1 | tee /tmp/live-streamlines-style.log
          target/streamlines-venv/bin/python -I crates/fmn-python/tests/live_vector_fields.py 2>&1 | tee /tmp/live-streamlines-fields.log
      - name: Land verified native sources on main
        run: |
          set -euo pipefail
          git add crates/fmn-library/src/fields.rs crates/fmn-library/tests/live_streamlines.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_streamlines.rs crates/fmn-python/python/fmn_python/initialization.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(fields): expose deterministic seed authoring and native live streamline integration'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve source and evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/live-streamlines-source-sha.txt
          git archive --format=tar.gz HEAD > /tmp/live-streamlines-source.tar.gz
          git diff > /tmp/live-streamlines-working.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-streamlines-${{ github.sha }}
          path: |
            /tmp/live-streamlines-*
            target/streamlines-wheel/*.whl
          retention-days: 3
