name: Native live scene recording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-scene-recording.yml'
      - 'scripts/patches/live-recording-integration.patch'
      - 'scripts/patches/live-recording-api.patch'
      - 'scripts/patches/atomic-output-no-clobber/**'
      - 'scripts/patches/portal-no-clobber.patch'
      - 'crates/fmn-python/src/portal_recording.rs'
      - 'crates/fmn-python/tests/live_recording.py'
      - 'crates/fmn-python/python/fmn_python/recording.py'
      - 'crates/fmn-python/tests/test_recording_protocol.py'
      - 'crates/fmn-python/tests/recording_sessions.py'
      - 'crates/fmn-python/tests/output_no_clobber.py'
      - 'crates/fmn-python/tests/recording_preview.py'
      - 'scripts/enable_camera_readback.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-scene-recording
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TARGET_DIR: target/portable
  PYO3_PYTHON: python
jobs:
  native:
    if: github.repository == 'Dicklesworthstone/franken_manim' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 100
          clean: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Install pinned compiler and host packages
        run: |
          rustup show active-toolchain
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1' 'IPython==9.14.0'
      - name: Install the optional video tool for required video acceptance
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-recording-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-recording-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-recording-
            cargo-${{ runner.os }}-${{ runner.arch }}-svg-
            cargo-${{ runner.os }}-${{ runner.arch }}-texture-pairs-
      - name: Implement and test create-only native publication
        run: |
          set -euo pipefail
          # The existing provenance build script already depends on fmn-hash.
          # Repair only that missing workspace edge; keep package pins unchanged.
          if git apply --include=Cargo.lock --check scripts/patches/live-recording-integration.patch; then
            git apply --include=Cargo.lock scripts/patches/live-recording-integration.patch
          else
            git apply --include=Cargo.lock --reverse --check scripts/patches/live-recording-integration.patch
          fi
          if ! grep -q 'pub fn publish_wav_new' crates/fmn-output/src/sinks.rs; then
            python - <<'PY'
          from pathlib import Path
          import gzip, hashlib, os, subprocess
          root = Path('scripts/patches/atomic-output-no-clobber')
          payload = gzip.decompress(b''.join((root / f'native.patch.gz.{i:03d}').read_bytes() for i in range(1, 5)))
          assert len(payload) == 29510
          assert hashlib.sha256(payload).hexdigest() == '86457dd7696ca0125e049b71c8a4c052b6430370bab2cdb3777b111da630225a'
          path = Path(os.environ['RUNNER_TEMP']) / 'native-no-clobber.patch'
          path.write_bytes(payload)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
          fi
          rustfmt --edition 2024 --config skip_children=true crates/fmn-platform/src/fs.rs crates/fmn-output/src/ffmpeg.rs crates/fmn-output/src/lib.rs crates/fmn-output/src/sinks.rs crates/fmn-output/tests/sinks.rs
          cargo test --locked -p fmn-platform
          cargo test --locked -p fmn-output
          git diff --check
      - name: Commit tested filesystem and output implementation directly to main
        run: |
          set -euo pipefail
          git add Cargo.lock crates/fmn-platform/src/fs.rs crates/fmn-output/src/ffmpeg.rs crates/fmn-output/src/lib.rs crates/fmn-output/src/sinks.rs crates/fmn-output/tests/sinks.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(output): publish native and encoded artifacts atomically without clobbering'
            for attempt in 1 2 3; do
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                git rebase origin/main
                cargo test --locked -p fmn-platform -p fmn-output
              fi
              if git push origin HEAD:main; then break; fi
              test "$attempt" != 3
            done
          fi
          git rev-parse HEAD
      - name: Connect protected output to live recordings and ordinary renders
        run: |
          set -euo pipefail
          if ! grep -qx 'mod portal_recording;' crates/fmn-python/src/lib.rs; then
            git apply --exclude=Cargo.lock --check scripts/patches/live-recording-integration.patch
            git apply --exclude=Cargo.lock scripts/patches/live-recording-integration.patch
          fi
          if ! grep -q '"RecordingSession", "record_scene"' crates/fmn-python/python/fmn_python/__init__.py; then
            git apply --check scripts/patches/live-recording-api.patch
            git apply scripts/patches/live-recording-api.patch
          fi
          if ! grep -q 'fmn_output::publish_wav_new(' crates/fmn-python/src/lib.rs; then
            git apply --check scripts/patches/portal-no-clobber.patch
            git apply scripts/patches/portal-no-clobber.patch
          fi
          git diff --check
      - name: Test native live geometry, clock, audio and cancellation
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_recording.rs crates/fmn-python/src/portal_playback.rs crates/fmn-python/src/portal_audio.rs crates/fmn-python/src/portal_video.rs
          cargo test --locked -p fmn-python portal_recording -- --nocapture
          cargo test --locked -p fmn-python portal_playback::tests::insert_timeline
          python -m maturin build --locked --profile dev --out /tmp/recording-wheels
          python -m pip install --no-deps --force-reinstall /tmp/recording-wheels/*.whl
          python crates/fmn-python/tests/live_recording.py
          python crates/fmn-python/tests/batch_rendering.py
          PYTHONPATH=crates/fmn-python/python:crates/fmn-python/tests python -m unittest test_recording_protocol test_scene_console_protocol test_scene_console_ipython test_embedded_shell_protocol test_embedded_shell_ipython test_scene_console_worker
          FMN_REQUIRE_FFMPEG=1 python crates/fmn-python/tests/recording_sessions.py
          FMN_REQUIRE_FFMPEG=1 python crates/fmn-python/tests/output_no_clobber.py
          git diff --check
      - name: Commit tested native recording integration directly to main
        run: |
          set -euo pipefail
          git add crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_recording.rs crates/fmn-python/src/portal_playback.rs crates/fmn-python/src/portal_audio.rs crates/fmn-python/src/portal_video.rs
          git add crates/fmn-python/python/fmn_python/__init__.py crates/fmn-python/python/fmn_python/scene_console.py crates/fmn-python/python/fmn_python/embedded_shell.py crates/fmn-python/tests/test_embedded_shell_protocol.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(python): activate safe native recording on populated scenes and console cells'
            for attempt in 1 2 3; do
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                git rebase origin/main
                cargo test --locked -p fmn-python portal_recording -- --nocapture
              fi
              if git push origin HEAD:main; then break; fi
              test "$attempt" != 3
            done
          fi
          git rev-parse HEAD
      - name: Activate observational preview for ordinary and recorded cells
        run: |
          set -euo pipefail
          python scripts/enable_camera_readback.py
          rustfmt --edition 2024 --config skip_children=true crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_readback.rs
          PYTHONPATH=crates/fmn-python/python:crates/fmn-python/tests python -m unittest test_camera_capture_protocol test_scene_console_protocol test_scene_console_ipython test_embedded_shell_protocol test_embedded_shell_ipython test_scene_console_worker test_recording_protocol
          cargo test --locked -p fmn-python production_camera_readback_acceptance_suite -- --nocapture
          cargo test --locked -p fmn-python portal_console -- --nocapture
          python -m maturin build --locked --profile dev --out /tmp/preview-wheels
          python -m pip install --no-deps --force-reinstall /tmp/preview-wheels/*.whl
          python crates/fmn-python/tests/camera_readback.py
          python crates/fmn-python/tests/scene_console_acceptance.py
          python crates/fmn-python/tests/recording_preview.py
          git diff --check
      - name: Commit tested recorded-cell preview directly to main
        run: |
          set -euo pipefail
          git add crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_readback.rs crates/fmn-python/python/fmn_python/initialization.py crates/fmn-python/tests/bridge.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(python): activate native camera previews for recorded and checkpointed cells'
            for attempt in 1 2 3; do
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                git rebase origin/main
                cargo test --locked -p fmn-python production_camera_readback_acceptance_suite -- --nocapture
                cargo test --locked -p fmn-python portal_console -- --nocapture
              fi
              if git push origin HEAD:main; then break; fi
              test "$attempt" != 3
            done
          fi
          git rev-parse HEAD
      - name: Preserve exact tested source and publication state
        if: always()
        run: |
          git log -4 --format='%H %s' > /tmp/live-recording-commits.txt
          git diff --binary > /tmp/live-recording-worktree.patch
          git archive --format=tar.gz HEAD > /tmp/live-recording-source.tar.gz
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-recording-${{ github.sha }}
          path: |
            /tmp/live-recording-source.tar.gz
            /tmp/live-recording-worktree.patch
            /tmp/live-recording-commits.txt
            /tmp/recording-wheels/*.whl
            /tmp/preview-wheels/*.whl
          if-no-files-found: error
          retention-days: 1
