name: Native SVG paint ingress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/svg-paint-ingress.yml'
      - 'crates/fmn-library/src/svg.rs'
      - 'crates/fmn-library/src/svg_paint.rs'
      - 'crates/fmn-library/tests/svg_paints.rs'
      - 'crates/fmn-python/src/portal_svg_ingress.rs'
      - 'crates/fmn-python/src/portal_typography.rs'
      - 'crates/fmn-python/python/fmn_python/svg_ingress.py'
      - 'crates/fmn-python/tests/native_svg_paints.py'
      - 'crates/fmn-python/tests/svg_paint_ingress.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-svg-paint-ingress
  cancel-in-progress: false
jobs:
  svg:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Native SVG and boolean regressions
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
          cargo test --locked -p fmn-library --test svg_paints --test drawings --test structural_classes 2>&1 | tee /tmp/svg-ingress-native.log
          cargo clippy --locked -p fmn-library --all-targets -- -D warnings 2>&1 | tee /tmp/svg-ingress-library-clippy.log
          cargo clippy --locked -p fmn-python --lib -- -D warnings 2>&1 | tee /tmp/svg-ingress-clippy.log
      - name: Build and exercise native SVG ingress
        run: |
          set -euo pipefail
          python -m maturin build --locked --interpreter python --profile dev --out target/svg-ingress-wheel 2>&1 | tee /tmp/svg-ingress-build.log
          python -m venv target/svg-ingress-venv
          target/svg-ingress-venv/bin/python -m pip install 'numpy==2.5.2' target/svg-ingress-wheel/*.whl
          for suite in native_svg_paints svg_paint_ingress text_authoring code_authoring copying_semantics fading_family portal_initialization; do
            target/svg-ingress-venv/bin/python -I "crates/fmn-python/tests/$suite.py" 2>&1 | tee "/tmp/svg-ingress-$suite.log"
          done
      - name: Preserve exact source and evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/svg-ingress-source-sha.txt
          git diff --exit-code
          git archive --format=tar.gz HEAD > /tmp/svg-ingress-source.tar.gz
          for path in crates/fmn-library/src/svg_paint.rs crates/fmn-library/tests/svg_paints.rs crates/fmn-python/src/portal_svg_ingress.rs; do
            rustfmt --edition 2024 --emit stdout "$path" > "/tmp/svg-ingress-formatted-$(basename "$path")"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-svg-ingress-${{ github.run_id }}
          path: |
            /tmp/svg-ingress-*
            target/svg-ingress-wheel/*.whl
          retention-days: 3
