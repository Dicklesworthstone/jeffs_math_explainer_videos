name: Native subdivided recording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/subdivided-recording.yml'
      - 'crates/fmn-python/python/fmn_python/subdivision.py'
      - 'crates/fmn-python/python/fmn_python/scene_execution.py'
      - 'crates/fmn-python/python/fmn_python/recording.py'
      - 'crates/fmn-python/python/fmn_python/rendering.py'
      - 'crates/fmn-python/tests/subdivided_recording.py'
      - 'crates/fmn-python/tests/subdivided_rendering.py'
      - 'crates/fmn-python/src/portal_recording.rs'
      - 'crates/fmn-python/python/fmn_python/subdivision_rendering.py'
      - 'crates/fmn-python/python/fmn_python/console_rendering.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subdivided-recording-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Build the exact source without overlays or activation patches
        run: |
          set -euo pipefail
          rustup show active-toolchain
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
          python -m maturin build --locked --interpreter python --profile dev --out target/subdivision-wheel 2>&1 | tee /tmp/subdivision-build.log
          python -m venv target/subdivision-venv
          target/subdivision-venv/bin/python -m pip install 'numpy==2.5.2' target/subdivision-wheel/*.whl
      - name: Exercise real native clips and existing lifecycle recovery
        run: |
          set -euo pipefail
          for suite in subdivided_recording subdivided_rendering callback_cleanup persistent_recovery composition_lifecycle recording_sessions programmatic_rendering; do
            target/subdivision-venv/bin/python -I crates/fmn-python/tests/$suite.py 2>&1 | tee /tmp/subdivision-$suite.log
          done
          git diff --exit-code
      - name: Preserve source identity and native runtime evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/subdivision-source-sha.txt
          git archive --format=tar.gz HEAD > /tmp/subdivision-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: subdivided-recording-${{ github.sha }}
          path: |
            /tmp/subdivision-*
            target/subdivision-wheel/*.whl
          retention-days: 3
