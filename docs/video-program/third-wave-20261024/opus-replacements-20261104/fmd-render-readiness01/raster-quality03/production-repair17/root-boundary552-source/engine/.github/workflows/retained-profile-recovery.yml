name: Retained profile recovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_profile_recovery.py'
      - '.github/workflows/retained-profile-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-parameter-motion
  cancel-in-progress: false
jobs:
  profile-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: target/scribe
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 64
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/scribe
          key: cargo-${{ runner.os }}-${{ runner.arch }}-profile-recovery-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-native-replay-
            cargo-${{ runner.os }}-${{ runner.arch }}-native-motion-
            cargo-${{ runner.os }}-${{ runner.arch }}-scribe-
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Repair variable-paint dependencies and reproduce the recovery cases
        run: |
          set -euo pipefail
          if ! grep -Fq 'let (style, profiled) = match &previous' crates/fmn-render/src/plan.rs; then
            python3 scripts/repair_profile_recovery.py
          fi
          rustfmt --edition 2024 --config skip_children=true crates/fmn-render/src/plan.rs \
            crates/fmn-render/src/fill_profile.rs crates/fmn-render/src/stroke_profile.rs \
            crates/fmn-render/tests/profile_recovery.rs
          cargo test --locked -p fmn-render --test degenerate_profiles --test profile_recovery 2>&1 | tee /tmp/profile-recovery-focused.log
          cargo clippy --locked -p fmn-render --all-targets -- -D warnings 2>&1 | tee /tmp/profile-recovery-clippy.log
          git diff --check
      - name: Publish verified retained-renderer repair directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/fmn-render/src/plan.rs crates/fmn-render/src/fill_profile.rs \
            crates/fmn-render/src/stroke_profile.rs crates/fmn-render/tests/profile_recovery.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(render): retain profile dependencies without rescanning unchanged paint'
          fi
          published=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            cargo test --locked -p fmn-render --test degenerate_profiles --test profile_recovery 2>&1 | tee "/tmp/profile-recovery-rebase-${attempt}.log"
            if git push origin HEAD:main; then published=1; break; fi
          done
          test "${published}" = 1
          git rev-parse HEAD | tee /tmp/profile-recovery-head.txt
      - name: Complete renderer regression suite without hiding later failures
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-render --lib --tests --no-fail-fast 2>&1 | tee /tmp/profile-recovery-render-tests.log
      - name: Native animation scene browser-player and public API regressions
        if: always()
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-mobject -p fmn-anim -p fmn-scene -p fmn-wasm --all-targets 2>&1 | tee /tmp/profile-recovery-native-tests.log
          cargo test --locked -p fmn --test public_api 2>&1 | tee /tmp/profile-recovery-public-api.log
          cargo clippy --locked -p fmn-mobject -p fmn-anim -p fmn-scene -p fmn-wasm --all-targets -- -D warnings 2>&1 | tee /tmp/profile-recovery-native-clippy.log
          cargo fmt --all -- --check
      - name: Preserve source and validation evidence
        if: always()
        run: |
          git diff > /tmp/profile-recovery-working.patch
          git archive --format=tar.gz HEAD > /tmp/profile-recovery-source.tar.gz
          git rev-parse 'HEAD^{tree}' > /tmp/profile-recovery-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-profile-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/profile-recovery-*
          retention-days: 1
