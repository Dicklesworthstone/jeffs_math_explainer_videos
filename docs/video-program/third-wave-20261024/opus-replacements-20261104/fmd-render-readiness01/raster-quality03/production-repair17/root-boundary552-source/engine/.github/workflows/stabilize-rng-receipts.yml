name: Stabilize RNG Receipts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stabilize-rng-receipts.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Remove rebase-unstable receipt fields
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow_edits = {
              Path(".github/workflows/implement-rng-cursor-and-sampling.yml"): [
                  '          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()\n',
                  '              "tested_source_sha_before_docs": head,\n',
              ],
              Path(".github/workflows/implement-rng-reservations.yml"): [
                  '          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()\n',
                  '              "tested_code_sha": head,\n',
              ],
          }
          for path, fragments in workflow_edits.items():
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for fragment in fragments:
                  text = text.replace(fragment, "")
              path.write_text(text, encoding="utf-8")

          receipt_fields = {
              Path("artifacts/implementation/rng-cursor-sampling-receipt.json"): [
                  "tested_source_sha_before_docs"
              ],
              Path("artifacts/implementation/rng-reservation-receipt.json"): [
                  "tested_code_sha"
              ],
          }
          for path, fields in receipt_fields.items():
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              for field in fields:
                  payload.pop(field, None)
              path.write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

          if [[ -e .github/workflows/implement-rng-cursor-and-sampling.yml ]]; then
            echo "cursor_pending=1" >> "$GITHUB_OUTPUT"
          else
            echo "cursor_pending=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable receipt definitions canonically
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stabilize-rng-receipts.yml
          git add .github/workflows artifacts/implementation 2>/dev/null || true
          git config user.name "FrankenManim Receipt Stability"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(evidence): bind RNG receipts to source hashes" -m "Remove pre-documentation commit IDs that can become stale after a validated rebase. Source hashes, semantic fixtures, and named executed gates remain the durable evidence identity."
          git fetch origin main master
          git rebase origin/main
          git push --atomic origin HEAD:main HEAD:master

      - name: Explicitly rerun the pending cursor implementation
        if: steps.pending.outputs.cursor_pending == '1'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/implement-rng-cursor-and-sampling.yml/dispatches" \
            -f ref=main
