name: Scribe

on:
  push:
    branches: [main]
    paths:
      - 'crates/fmn/**'
      - 'crates/fmn-cli/src/typesetting.rs'
      - 'crates/fmn-cli/tests/typesetting_cache.rs'
      - 'crates/fmn-text/**'
      - 'crates/fmn-tex/**'
      - 'crates/fmn-library/src/text.rs'
      - 'crates/fmn-library/src/tex.rs'
      - 'crates/fmn-library/tests/scribe_cache.rs'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/scribe.yml'
  pull_request:
    paths:
      - 'crates/fmn/**'
      - 'crates/fmn-cli/src/typesetting.rs'
      - 'crates/fmn-cli/tests/typesetting_cache.rs'
      - 'crates/fmn-text/**'
      - 'crates/fmn-tex/**'
      - 'crates/fmn-library/src/text.rs'
      - 'crates/fmn-library/src/tex.rs'
      - 'crates/fmn-library/tests/scribe_cache.rs'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/scribe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: target/scribe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/scribe
          key: cargo-${{ runner.os }}-${{ runner.arch }}-scribe-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # Independent of the Python portal gate: a failure in that unrelated
      # surface must not prevent the native Scribe regression suites running.
      - name: Native text and TeX regression suites
        run: cargo test --locked -p fmn-text -p fmn-tex --all-targets
      - name: Scribe clippy
        run: cargo clippy --locked -p fmn-text -p fmn-tex --all-targets -- -D warnings
      - name: Production Scribe builders
        run: cargo test --locked -p fmn-library --test scribe_cache
      - name: Native scene typesetting lifecycle
        run: cargo test --locked -p fmn --test native_typesetting --test dynamic_typesetting
      - name: Standalone typesetting cache lifecycle
        shell: bash
        run: |
          if test -f crates/fmn-cli/tests/typesetting_cache.rs; then
            cargo test --locked -p fmn-cli --features batch --test typesetting_cache
          else
            echo 'CLI cache integration candidate is not published in this source commit.'
          fi
      - name: Formatting
        run: cargo fmt --all -- --check

  cli-typesetting-candidate:
    # A bounded one-time candidate, not a source-mutating main-push workflow.
    # Later pushes validate the published source in the ordinary job above.
    if: github.event_name == 'push' && github.event.before == '4110c0e8929121a22e6f3b64c4fffd2b1b39f15b'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: target/scribe-candidate
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize the exact reviewed CLI candidate
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess, zlib
          source = pathlib.Path('crates/fmn-cli/src/lib.rs').read_bytes()
          digest = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
          assert digest == 'b1d27f97e23a131c0906b10a1c0a275f6494ad5f', 'CLI source changed: refuse to apply a stale candidate'
          patch = zlib.decompress(base64.b64decode(
              ''
          ))
          assert hashlib.sha256(patch).hexdigest() == '3fcf2b441873f39848aabb8f6941f4004aca86109014a800497102b8db22278a'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
      - name: Install the pinned toolchain and format candidate sources
        run: |
          rustup show active-toolchain
          cargo fmt --all
          git diff --check
      - name: Prepare unreferenced source blobs and exact-source evidence
        id: source
        # Only this step receives the token; this script creates blobs, never refs.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          allowed = {
              'crates/fmn-cli/src/lib.rs',
              'crates/fmn-cli/src/typesetting.rs',
              'crates/fmn-cli/tests/typesetting_cache.rs',
              'crates/fmn/src/typesetting.rs',
              'crates/fmn/tests/native_typesetting.rs',
              'crates/fmn/tests/dynamic_typesetting.rs',
              'crates/fmn-tex/src/session.rs',
              'crates/fmn-tex/tests/session.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']).decode().splitlines())
          assert changed <= allowed, f'unexpected candidate changes: {changed - allowed}'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'typesetting-candidate'
          root.mkdir()
          rows = []
          for name in sorted(changed):
              data = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/git/blobs",
                  data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == expected, f'blob mismatch for {name}'
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              rows.append({'path': name, 'sha': expected, 'sha256': hashlib.sha256(data).hexdigest()})
          report = {'source_head': os.environ['SOURCE_HEAD'], 'patch_sha256': '3fcf2b441873f39848aabb8f6941f4004aca86109014a800497102b8db22278a',
                    'status': 'prepared-only-not-validated-or-committed', 'files': rows}
          (root / 'sources.json').write_text(json.dumps(report, indent=2) + '\n')
          print('TYPESETTING_CANDIDATE_SOURCES=' + json.dumps(report, sort_keys=True))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesetting-candidate-sources-${{ github.sha }}
          path: ${{ runner.temp }}/typesetting-candidate
          retention-days: 3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/scribe-candidate
          key: typesetting-candidate-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Native scene and real-process CLI regressions
        id: tests
        run: |
          set -euo pipefail
          cargo test --locked -p fmn --test native_typesetting --test dynamic_typesetting
          cargo test --locked -p fmn-cli --features batch --test typesetting_cache --test camera_pipeline --test compiled_pipeline
      - name: Clippy on the candidate
        id: clippy
        run: cargo clippy --locked -p fmn -p fmn-cli --features fmn-cli/batch --all-targets -- -D warnings
      - name: Final validation receipt
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        shell: python
        run: |
          import json, os
          print('TYPESETTING_CANDIDATE_VALIDATION=' + json.dumps({
              name: os.environ.get(name, '') for name in
              ['SOURCE_OUTCOME', 'TEST_OUTCOME', 'CLIPPY_OUTCOME']
          }, sort_keys=True))
