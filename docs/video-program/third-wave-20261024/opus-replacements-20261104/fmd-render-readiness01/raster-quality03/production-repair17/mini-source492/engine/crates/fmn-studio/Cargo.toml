[package]
name = "fmn-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Studio"

[features]
default = []
metal = ["fmn-render/metal"]
# Development-host Cargo rebuilds only, never a scene-visible tool escape.
native-build = ["fmn-platform/exact-process"]

[dependencies]
fmn-core.workspace = true
fmn-hash.workspace = true
fmn-platform.workspace = true
fmn-frame.workspace = true
fmn-codec.workspace = true
fmn-cache.workspace = true
fmn-render.workspace = true
fmn-scene.workspace = true

[dev-dependencies]
fmn-anim.workspace = true
fmn-mobject.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["pty"] }

[[example]]
name = "native_project"
required-features = ["native-build"]

[lints]
workspace = true
