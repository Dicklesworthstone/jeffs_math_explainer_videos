name: Native Python SVG output
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-svg-output.yml'
      - 'scripts/patches/portal-svg-integration.patch'
      - 'crates/fmn-python/src/portal_svg.rs'
      - 'crates/fmn-python/python/fmn_python/rendering.py'
      - 'crates/fmn-python/python/fmn_python/batch_rendering.py'
      - 'crates/fmn-python/python/fmn_python/batch_checkpoint.py'
      - 'crates/fmn-python/python/fmn_python/checkpoint_cli.py'
      - 'crates/fmn-python/python/fmn_python/console_rendering.py'
      - 'crates/fmn-python/tests/test_batch_checkpoint_helpers.py'
      - 'crates/fmn-python/tests/test_batch_checkpoint_cli.py'
      - 'crates/fmn-python/tests/test_batch_checkpoint_io.py'
      - 'crates/fmn-python/tests/batch_checkpoint_acceptance.py'
      - 'crates/fmn-python/tests/svg_output.py'
      - 'crates/fmn-python/tests/svg_console.py'
      - 'crates/fmn-python/tests/test_svg_output_protocol.py'
      - 'crates/fmn-python/tests/test_imperative_rendering_protocol.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portal-svg-output
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TARGET_DIR: target/portable
  PYO3_PYTHON: python
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Connect native SVG to the existing output session
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qx 'mod portal_svg;' crates/fmn-python/src/lib.rs; then
            git apply --check scripts/patches/portal-svg-integration.patch
            git apply scripts/patches/portal-svg-integration.patch
          fi
          git diff --check
          git rev-parse HEAD
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Install pinned compiler and Python hosts
        run: |
          rustup show active-toolchain
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-svg-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-svg-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test actual adapters and native vector publication
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true crates/fmn-library/src/svg_export.rs crates/fmn-output/src/lib.rs crates/fmn-output/src/sinks.rs crates/fmn-output/tests/sinks.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_playback.rs crates/fmn-python/src/portal_svg.rs crates/fmn-conformance/tests/e2e_scenarios.rs
          PYTHONPATH=crates/fmn-python/python:crates/fmn-python/tests python -m unittest test_imperative_rendering_protocol test_svg_output_protocol test_render_session_protocol test_batch_rendering_protocol test_console_rendering_protocol test_render_selection_protocol test_batch_checkpoint_helpers test_batch_checkpoint_cli test_batch_checkpoint_io
          cargo test --locked -p fmn-library svg_export::tests
          cargo test --locked -p fmn-output --test sinks svg_
          cargo test --locked -p fmn-python portal_svg -- --nocapture
          cargo test --locked -p fmn-conformance --test e2e_scenarios python_svg_scenario_passes -- --nocapture
          git diff --check
      - name: Commit native implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add crates/fmn-library/src/svg_export.rs crates/fmn-output/src/lib.rs crates/fmn-output/src/sinks.rs crates/fmn-output/tests/sinks.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_playback.rs crates/fmn-python/src/portal_svg.rs crates/fmn-python/python/fmn_python/rendering.py crates/fmn-python/python/fmn_python/console_rendering.py crates/fmn-python/python/fmn_python/batch_cli.py crates/fmn-python/python/manimlib_bootstrap.py crates/fmn-conformance/tests/e2e_scenarios.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(python): export native SVG scenes through render, sessions and batch output'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
      - name: Installed-wheel vector output and batch recovery acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m maturin build --locked --profile dev --out /tmp/svg-wheels
          python -m pip install --no-deps --force-reinstall /tmp/svg-wheels/*.whl
          python crates/fmn-python/tests/svg_output.py
          python crates/fmn-python/tests/svg_console.py
          python crates/fmn-python/tests/batch_rendering.py
          python crates/fmn-python/tests/batch_checkpoint_acceptance.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-svg-wheel-${{ github.sha }}
          path: /tmp/svg-wheels/*.whl
          if-no-files-found: ignore
          retention-days: 1
