            -m "Implement the pinned lifecycle, validation, deterministic naming, helper updates, family zipping, lagged sub-alpha calculation, deep copy, and fluent rate/name API. Complete Transform alignment, target preservation, data locking, point-path versus style and uniform interpolation, arc-path fallback, replacement cleanup, and TransformFromCopy source isolation with permanent portal regressions." \
            -m "Relates-to: fm-5wq.4"

