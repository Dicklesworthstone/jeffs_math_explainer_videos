[package]
name = "fmn-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Filesystem/process/clock/AssetFetcher capability traits plus HardwareTopology introspection (§17.4)."

[features]
# Native exact-image spawning is part of the ordinary platform surface, but
# consumers which only need deterministic filesystem/clock/profile traits may
# opt out. The optional CPython portal enables it explicitly for Reel's
# governed ffmpeg encode/mux boundary; it never launches an interpreter.
default = ["exact-process"]
exact-process = ["dep:asupersync"]

[dependencies]
fmn-core.workspace = true

# The exact-image process substrate exists only where a process boundary can
# exist (D2). On wasm32 the capability is structurally absent —
# `process::NoProcessRunner` fails closed with the named capability error —
# so the substrate is gated out of the wasm graph entirely rather than
# carried as dead weight.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
asupersync = { workspace = true, optional = true }

# W5 wasm tier 1 (fm-l97): the browser capability implementations bind
# `performance.now` / `Date.now` through wasm-bindgen extern imports — the
# one new dependency D1 pre-authorizes for the wasm feature
# (SUITE_ALLOWLIST.tsv wasm row). Macro expansion only; the crate keeps
# forbid(unsafe_code). Native builds never see it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[lints]
workspace = true
