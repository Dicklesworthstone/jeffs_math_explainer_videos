# VIDEO_CORPUS.lock — the corpus gate's pinned scene allowlist (fm-rqc, §15.3-15.4)
#
# The G4a criterion this lock serves: every allowlisted scene runs
# SOURCE-UNEDITED through the fmn-python portal under the [shims]
# documented below, and passes structural assertions (object counts,
# timings, bounding envelopes) plus Look-Gallery review. Pixel diffs
# are deleted by design (§4).
#
# Fixture policy (CC BY-NC-SA): the 3b1b/videos tree is © Grant
# Sanderson, CC BY-NC-SA; gallery fixtures derived from it stay
# private; the public corpus is the permissive primitive set. Every
# scene row carries its in-tree provenance as attribution.
#
# Absence from this lock is NO claim. Exclusion rows are deliberate,
# reasoned rejections (R13). Regenerate only via:
#   VIDEO_CORPUS_UPDATE=1 python3 scripts/video_corpus.py emit
# Verify against the pinned checkout via:
#   python3 scripts/video_corpus.py verify

