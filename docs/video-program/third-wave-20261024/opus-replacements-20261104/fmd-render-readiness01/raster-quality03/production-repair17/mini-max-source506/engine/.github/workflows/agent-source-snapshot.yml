name: Repair Agent Brief Atomicity and SVG Closure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-agent-brief-and-svg
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Capture exact source identity
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install governed toolchain and verified tracker binary
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(awk -F '\t' '$1 == "rustc" { print $2 }' SUITE.lock)"
          [[ -n "$toolchain" ]] || {
            echo "SUITE.lock has no governed rustc row" >&2
            exit 2
          }
          grep -Fq "channel = \"$toolchain\"" rust-toolchain.toml
          rustup toolchain install "$toolchain" \
            --profile minimal \
            --component clippy,rustfmt,rust-src
          rustup override set "$toolchain"

          archive="$RUNNER_TEMP/br-0.5.10-linux_amd64.tar.gz"
          extract_dir="$RUNNER_TEMP/br-extract"
          install_dir="$RUNNER_TEMP/br/bin"
          curl -fsSL \
            https://github.com/Dicklesworthstone/beads_rust/releases/download/v0.5.10/br-0.5.10-linux_amd64.tar.gz \
            -o "$archive"
          echo "1956c808601588a7ab7ee807f1f54a4453387b02eddfbf4469a86abdc7ecf366  $archive" \
            | sha256sum --check --strict
          mkdir -p "$extract_dir" "$install_dir"
          tar -xzf "$archive" -C "$extract_dir"
          br_path="$(find "$extract_dir" -type f -name br -perm -u+x -print -quit)"
          [[ -n "$br_path" ]] || {
            echo "verified beads_rust archive contains no executable br binary" >&2
            exit 3
          }
          install -m 0755 "$br_path" "$install_dir/br"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/br" version

      - name: Cache Cargo state for the geometry proof
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/agent-svg-repair
          key: agent-svg-repair-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Create and claim the atomic-output regression bead
        shell: bash
        env:
          CLAIM_ACTOR: GPT-5.6-Pro-Control-Implementer
          ISSUE_TITLE: "W10: Harden generated agent-brief temporary-file ownership against inode reuse"
        run: |
          set -euo pipefail
          br sync --import-only
          issue_id="$(python3 - "$ISSUE_TITLE" <<'PY'
          import json
          import sys
          from pathlib import Path

          title = sys.argv[1]
          matches = []
          for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines():
              issue = json.loads(line)
              if issue.get("title") == title:
                  matches.append(issue["id"])
          if len(matches) > 1:
              raise SystemExit(f"duplicate atomic-output beads: {matches}")
          print(matches[0] if matches else "")
          PY
          )"
          if [[ -z "$issue_id" ]]; then
            description="$(cat <<'EOF'
          The generated agent-brief publisher remembers only `(st_dev, st_ino)` for its owned temporary file. A failed replace can unlink that file, recreate a foreign file at the same path, receive an immediately reused inode, and trick cleanup into deleting the substitute. Bind cleanup to a post-write metadata fingerprint while retaining ordinary failed-replace cleanup.

          Acceptance:
          - Ownership includes device, inode, final size, mtime_ns, and ctime_ns.
          - The fingerprint is refreshed through the still-open descriptor after write/flush/fsync.
          - An ordinary replace failure removes the publisher-owned temporary.
          - A substituted path is preserved and emits the stable identity-changed diagnostic.
          - Deterministic inode-reuse and end-to-end substitution regressions pass with the complete agent control-plane suite.
          EOF
            )"
            br create \
              --actor "$CLAIM_ACTOR" \
              --title "$ISSUE_TITLE" \
              --type bug \
              --priority 0 \
              --labels "W10,agent-control-plane,security,regression" \
              --description "$description" \
              --json
            br sync --flush-only
            issue_id="$(python3 - "$ISSUE_TITLE" <<'PY'
          import json
          import sys
          from pathlib import Path

          title = sys.argv[1]
          matches = []
          for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines():
              issue = json.loads(line)
              if issue.get("title") == title:
                  matches.append(issue)
          if len(matches) != 1:
              raise SystemExit(f"expected one created atomic-output bead, found {len(matches)}")
          print(matches[0]["id"])
          PY
            )"
          fi
          status="$(python3 - "$issue_id" <<'PY'
          import json
          import sys
          from pathlib import Path

          issue_id = sys.argv[1]
          for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines():
              issue = json.loads(line)
              if issue.get("id") == issue_id:
                  print(issue.get("status", ""))
                  break
          else:
              raise SystemExit(f"missing bead {issue_id}")
          PY
          )"
          if [[ "$status" == "open" ]]; then
            br update --actor "$CLAIM_ACTOR" "$issue_id" --claim --json
            br sync --flush-only
          elif [[ "$status" != "in_progress" && "$status" != "closed" ]]; then
            echo "unexpected atomic-output bead status: $status" >&2
            exit 4
          fi
          echo "CONTROL_ISSUE_ID=$issue_id" >> "$GITHUB_ENV"
          echo "CONTROL_ALREADY_CLOSED=$([[ "$status" == "closed" ]] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          br show "$issue_id" --json

      - name: Harden owned temporary identity and lock the inode-reuse regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("scripts/generate_agent_brief.py")
          text = source.read_text(encoding="utf-8")
          old_identity = '''def _file_identity(metadata: os.stat_result) -> tuple[int, int]:
              return metadata.st_dev, metadata.st_ino
          '''
          new_identity = '''FileIdentity = tuple[int, int, int, int, int]


          def _file_identity(metadata: os.stat_result) -> FileIdentity:
              return (
                  metadata.st_dev,
                  metadata.st_ino,
                  metadata.st_size,
                  metadata.st_mtime_ns,
                  metadata.st_ctime_ns,
              )
          '''
          if old_identity in text:
              text = text.replace(old_identity, new_identity, 1)
          elif new_identity not in text:
              raise SystemExit("agent-brief file-identity anchor drifted")

          old_remove = "def _remove_owned_temporary(path: Path, identity: tuple[int, int]) -> str | None:"
          new_remove = "def _remove_owned_temporary(path: Path, identity: FileIdentity) -> str | None:"
          if old_remove in text:
              text = text.replace(old_remove, new_remove, 1)
          elif new_remove not in text:
              raise SystemExit("agent-brief cleanup annotation anchor drifted")

          old_annotation = "    identity: tuple[int, int] | None = None"
          new_annotation = "    identity: FileIdentity | None = None"
          if old_annotation in text:
              text = text.replace(old_annotation, new_annotation, 1)
          elif new_annotation not in text:
              raise SystemExit("agent-brief write identity annotation anchor drifted")

          old_write = '''        with os.fdopen(descriptor, "w", encoding="utf-8", newline="\\n") as handle:
                      descriptor = None
                      handle.write(document)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temporary, path)
          '''
          new_write = '''        with os.fdopen(descriptor, "w", encoding="utf-8", newline="\\n") as handle:
                      descriptor = None
                      try:
                          handle.write(document)
                          handle.flush()
                          os.fsync(handle.fileno())
                      finally:
                          try:
                              identity = _file_identity(os.fstat(handle.fileno()))
                          except OSError:
                              pass
                  os.replace(temporary, path)
          '''
          if old_write in text:
              text = text.replace(old_write, new_write, 1)
          elif new_write not in text:
              raise SystemExit("agent-brief post-write identity anchor drifted")
          source.write_text(text, encoding="utf-8")

          tests = Path("scripts/test_generate_agent_brief_io.py")
          text = tests.read_text(encoding="utf-8")
          import_anchor = "from pathlib import Path\n"
          import_line = "from types import SimpleNamespace\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("agent-brief I/O test import anchor drifted")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          test_anchor = "    def test_replace_failure_removes_only_the_temporary_file_it_created(self) -> None:\n"
          test_case = '''    def test_identity_fingerprint_detects_reused_inode_metadata(self) -> None:
                  owned = SimpleNamespace(
                      st_dev=11,
                      st_ino=29,
                      st_size=4096,
                      st_mtime_ns=101,
                      st_ctime_ns=103,
                  )
                  substitute = SimpleNamespace(
                      st_dev=11,
                      st_ino=29,
                      st_size=8,
                      st_mtime_ns=107,
                      st_ctime_ns=109,
                  )
                  self.assertNotEqual(
                      generator._file_identity(owned),
                      generator._file_identity(substitute),
                  )

          '''
          if test_case not in text:
              if test_anchor not in text:
                  raise SystemExit("agent-brief I/O test insertion anchor drifted")
              text = text.replace(test_anchor, test_case + test_anchor, 1)
          tests.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile scripts/generate_agent_brief.py scripts/test_generate_agent_brief_io.py
          git diff --check

      - name: Run the complete agent control-plane acceptance slice
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/agent_brief.py \
            scripts/agent_next.py \
            scripts/agent_task_semantics.py \
            scripts/agent_claim_policy.py \
            scripts/agent_claim_guard.py \
            scripts/agent_claim.py \
            scripts/generate_agent_brief.py \
            scripts/test_agent_brief.py \
            scripts/test_agent_brief_strict_json.py \
            scripts/test_agent_next.py \
            scripts/test_agent_next_output.py \
            scripts/test_agent_scope.py \
            scripts/test_agent_claim_policy.py \
            scripts/test_agent_claim_guard.py \
            scripts/test_agent_task_semantics.py \
            scripts/test_agent_claim.py \
            scripts/test_agent_claim_subprocess.py \
            scripts/test_generate_agent_brief.py \
            scripts/test_generate_agent_brief_io.py
          python3 scripts/agent_brief.py --format json --limit 1 --check >/dev/null
          python3 scripts/test_agent_brief.py
          python3 scripts/test_agent_brief_strict_json.py
          python3 scripts/test_agent_next.py
          python3 scripts/test_agent_next_output.py
          python3 scripts/test_agent_scope.py
          python3 scripts/test_agent_claim_policy.py
          python3 scripts/test_agent_claim_guard.py
          python3 scripts/test_agent_task_semantics.py
          python3 scripts/test_agent_claim.py
          python3 scripts/test_agent_claim_subprocess.py
          python3 scripts/test_generate_agent_brief.py
          python3 scripts/test_generate_agent_brief_io.py
          python3 scripts/agent_next.py --format json --check >/dev/null
          python3 scripts/generate_agent_brief.py --stdout >/dev/null

      - name: Close the atomic-output bead with independent review identity
        if: env.CONTROL_ALREADY_CLOSED != '1'
        shell: bash
        env:
          REVIEW_ACTOR: GPT-5.6-Pro-Control-Reviewer
        run: |
          set -euo pipefail
          br close \
            --actor "$REVIEW_ACTOR" \
            "$CONTROL_ISSUE_ID" \
            --reason "Temporary ownership is now bound to a post-write device/inode/size/mtime/ctime fingerprint. Ordinary failed replacements clean up their owned file, substituted paths survive with the stable identity-changed diagnostic, and the complete agent control-plane acceptance slice passed." \
            --json
          br sync --flush-only
          br show "$CONTROL_ISSUE_ID" --json

      - name: Commit and publish the atomic-output repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          allowed=(
            .beads/issues.jsonl
            .beads/metadata.json
            scripts/generate_agent_brief.py
            scripts/test_generate_agent_brief_io.py
          )
          printf '%s\n' "${changed[@]}" | sort -u > "$RUNNER_TEMP/control-changed"
          printf '%s\n' "${allowed[@]}" | sort -u > "$RUNNER_TEMP/control-allowed"
          unexpected="$(comm -23 "$RUNNER_TEMP/control-changed" "$RUNNER_TEMP/control-allowed")"
          if [[ -n "$unexpected" ]]; then
            printf 'atomic-output repair changed unrelated paths:\n%s\n' "$unexpected" >&2
            exit 5
          fi
          for mandatory in \
            .beads/issues.jsonl \
            scripts/generate_agent_brief.py \
            scripts/test_generate_agent_brief_io.py
          do
            grep -Fxq "$mandatory" "$RUNNER_TEMP/control-changed"
          done
          git add \
            .beads/issues.jsonl \
            scripts/generate_agent_brief.py \
            scripts/test_generate_agent_brief_io.py
          if [[ -f .beads/metadata.json ]]; then
            git add .beads/metadata.json
          fi
          git diff --cached --check
          git config user.name "FrankenManim Control Plane Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "fix(agent): preserve substituted temporary outputs" \
            -m "Refresh the owned-file fingerprint after durable writes and include size plus nanosecond timestamps, so inode reuse cannot make cleanup unlink a foreign replacement. Close $CONTROL_ISSUE_ID after the full agent control-plane regression slice passes."
          git fetch origin main master
          [[ "$(git rev-parse origin/main)" == "$START_SHA" ]] || {
            echo "main moved during atomic-output verification" >&2
            exit 6
          }
          [[ "$(git rev-parse origin/master)" == "$START_SHA" ]] || {
            echo "master diverged during atomic-output verification" >&2
            exit 7
          }
          git push --atomic origin HEAD:main HEAD:master
          echo "CONTROL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create and claim the private SVG-emitter cleanup bead
        shell: bash
        env:
          CLAIM_ACTOR: GPT-5.6-Pro-Geometry-Implementer
          ISSUE_TITLE: "W3: Remove duplicate private SVG document emitter while preserving the public facade"
        run: |
          set -euo pipefail
          br sync --import-only
          issue_id="$(python3 - "$ISSUE_TITLE" <<'PY'
          import json
          import sys
          from pathlib import Path

          title = sys.argv[1]
          matches = []
          for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines():
              issue = json.loads(line)
              if issue.get("title") == title:
                  matches.append(issue["id"])
          if len(matches) > 1:
              raise SystemExit(f"duplicate SVG-emitter beads: {matches}")
          print(matches[0] if matches else "")
          PY
          )"
          if [[ -z "$issue_id" ]]; then
            description="$(cat <<'EOF'
          `fmn-geom` exposes SVG through the UTF-8-safe `svg_safe.rs` facade, which owns the public `emit_svg_document`. The private parser module retains a second document emitter that is neither re-exported nor used, causing strict dead-code failure and creating two apparent authorities. Remove only the duplicate private wrapper while keeping the shared low-level `emit_svg` implementation and public round-trip behavior.

          Acceptance:
          - The safe facade remains the only public document-emitter authority.
          - The private parser keeps `emit_svg` for the facade and explicit viewport callers.
          - Existing SVG golden round-trip and closure-state tests pass.
          - `fmn-geom` Clippy and rustdoc pass with warnings denied.
          EOF
            )"
            br create \
              --actor "$CLAIM_ACTOR" \
              --title "$ISSUE_TITLE" \
              --type chore \
              --priority 1 \
              --labels "W3,geometry,svg,closure" \
              --description "$description" \
              --json
            br sync --flush-only
            issue_id="$(python3 - "$ISSUE_TITLE" <<'PY'
          import json
          import sys
          from pathlib import Path

          title = sys.argv[1]
          matches = []
          for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines():
              issue = json.loads(line)
              if issue.get("title") == title:
                  matches.append(issue)
          if len(matches) != 1:
              raise SystemExit(f"expected one created SVG-emitter bead, found {len(matches)}")
          print(matches[0]["id"])
          PY
            )"
          fi
          status="$(python3 - "$issue_id" <<'PY'
          import json
          import sys
          from pathlib import Path

          issue_id = sys.argv[1]
          for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines():
              issue = json.loads(line)
              if issue.get("id") == issue_id:
                  print(issue.get("status", ""))
                  break
          else:
              raise SystemExit(f"missing bead {issue_id}")
          PY
          )"
          if [[ "$status" == "open" ]]; then
            br update --actor "$CLAIM_ACTOR" "$issue_id" --claim --json
            br sync --flush-only
          elif [[ "$status" != "in_progress" && "$status" != "closed" ]]; then
            echo "unexpected SVG-emitter bead status: $status" >&2
            exit 8
          fi
          echo "SVG_ISSUE_ID=$issue_id" >> "$GITHUB_ENV"
          echo "SVG_ALREADY_CLOSED=$([[ "$status" == "closed" ]] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          br show "$issue_id" --json

      - name: Remove the duplicate private SVG document wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fmn-geom/src/svg.rs")
          text = path.read_text(encoding="utf-8")
          marker = "/// Emit one resolved document back to SVG bytes.\n"
          next_marker = "/// Emit resolved shapes as an SVG document with the given viewport.\n"
          if marker in text:
              start = text.index(marker)
              end = text.index(next_marker, start)
              text = text[:start] + text[end:]
          elif "pub fn emit_svg_document(document: &SvgDocument) -> String" in text:
              raise SystemExit("private SVG document emitter exists without its reviewed marker")

          old_docs = '''/// A `view_box` here is a caller decision about the emitted coordinate
          /// system — [`emit_svg_document`] deliberately passes `None`, because its
          /// shapes are already in final user space.
          '''
          new_docs = '''/// A `view_box` here is a caller decision about the emitted coordinate
          /// system. The UTF-8-safe public facade's document emitter deliberately
          /// passes `None`, because its shapes are already in final user space.
          '''
          if old_docs in text:
              text = text.replace(old_docs, new_docs, 1)
          elif new_docs not in text:
              raise SystemExit("private SVG emitter documentation anchor drifted")
          if "pub fn emit_svg_document(document: &SvgDocument) -> String" in text:
              raise SystemExit("duplicate private SVG document emitter remains")
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all -- --check
          git diff --check

      - name: Prove public SVG behavior and the strict geometry closure
        shell: bash
        env:
          CARGO_TARGET_DIR: target/agent-svg-repair
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-geom
          cargo clippy --locked -p fmn-geom --all-targets --no-deps -- -D warnings
          cargo doc --locked -p fmn-geom --no-deps

      - name: Close the SVG-emitter bead with independent review identity
        if: env.SVG_ALREADY_CLOSED != '1'
        shell: bash
        env:
          REVIEW_ACTOR: GPT-5.6-Pro-Geometry-Reviewer
        run: |
          set -euo pipefail
          br close \
            --actor "$REVIEW_ACTOR" \
            "$SVG_ISSUE_ID" \
            --reason "The UTF-8-safe facade remains the sole public document-emitter authority; the unused private wrapper is gone, shared emit_svg remains, and all fmn-geom tests, strict Clippy, and rustdoc passed." \
            --json
          br sync --flush-only
          br show "$SVG_ISSUE_ID" --json

      - name: Commit and publish the SVG closure repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          allowed=(
            .beads/issues.jsonl
            .beads/metadata.json
            crates/fmn-geom/src/svg.rs
          )
          printf '%s\n' "${changed[@]}" | sort -u > "$RUNNER_TEMP/svg-changed"
          printf '%s\n' "${allowed[@]}" | sort -u > "$RUNNER_TEMP/svg-allowed"
          unexpected="$(comm -23 "$RUNNER_TEMP/svg-changed" "$RUNNER_TEMP/svg-allowed")"
          if [[ -n "$unexpected" ]]; then
            printf 'SVG closure repair changed unrelated paths:\n%s\n' "$unexpected" >&2
            exit 9
          fi
          for mandatory in .beads/issues.jsonl crates/fmn-geom/src/svg.rs; do
            grep -Fxq "$mandatory" "$RUNNER_TEMP/svg-changed"
          done
          git add .beads/issues.jsonl crates/fmn-geom/src/svg.rs
          if [[ -f .beads/metadata.json ]]; then
            git add .beads/metadata.json
          fi
          git diff --cached --check
          git config user.name "FrankenManim SVG Closure Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "fix(geom): keep one public SVG document emitter" \
            -m "Remove the unused parser-private wrapper while preserving the UTF-8-safe facade and shared viewport emitter. Close $SVG_ISSUE_ID after golden round trips, strict Clippy, and rustdoc pass."
          git fetch origin main master
          [[ "$(git rev-parse origin/main)" == "$CONTROL_COMMIT" ]] || {
            echo "main moved during SVG verification" >&2
            exit 10
          }
          [[ "$(git rev-parse origin/master)" == "$CONTROL_COMMIT" ]] || {
            echo "master diverged during SVG verification" >&2
            exit 11
          }
          git push --atomic origin HEAD:main HEAD:master
          echo "SVG_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Archive the completed repair transaction without deleting history
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/agent-source-snapshot.yml <<'EOF'
          name: "Archived: Agent Brief Atomicity and SVG Closure Repair"

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            archived:
              if: ${{ false }}
              runs-on: ubuntu-24.04
              steps:
                - run: echo "This completed exact-head repair transaction is intentionally inert; its full source remains in Git history."
          EOF
          git diff --check
          git add .github/workflows/agent-source-snapshot.yml
          git config user.name "FrankenManim Workflow Archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: archive the completed control-plane and SVG repair"
          git fetch origin main master
          [[ "$(git rev-parse origin/main)" == "$SVG_COMMIT" ]] || {
            echo "main moved before repair-workflow archival" >&2
            exit 12
          }
          [[ "$(git rev-parse origin/master)" == "$SVG_COMMIT" ]] || {
            echo "master diverged before repair-workflow archival" >&2
            exit 13
          }
          git push --atomic origin HEAD:main HEAD:master
