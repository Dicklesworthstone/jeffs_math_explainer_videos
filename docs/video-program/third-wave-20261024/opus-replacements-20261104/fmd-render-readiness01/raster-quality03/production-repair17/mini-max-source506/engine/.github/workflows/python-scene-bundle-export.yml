name: Python scene bundle export
on:
  push:
    branches: [main]
    paths:
      - 'crates/fmn-python/src/portal_studio*'
      - 'crates/fmn-python/src/portal_studio/**'
      - 'crates/fmn-python/src/portal_recording.rs'
      - 'crates/fmn-python/python/fmn_python/bundle_*.py'
      - 'crates/fmn-python/python/fmn_python/__main__.py'
      - 'crates/fmn-python/tests/*bundle*'
      - 'crates/fmn-scene/src/recording.rs'
      - 'crates/fmn-scene/src/timeline_bundle*'
      - 'crates/fmn-scene/src/timeline_bundle/**'
      - 'crates/fmn/src/exporting.rs'
      - 'crates/fmn/src/exporting/**'
      - 'crates/fmn/tests/native_camera_export.rs'
      - 'crates/fmn/src/rendering/compiled.rs'
      - 'crates/fmn/src/rendering/pipeline.rs'
      - 'crates/fmn-conformance/tests/camera_bundle.rs'
      - 'crates/fmn-wasm/src/player.rs'
      - 'crates/fmn-scene/tests/camera_recording.rs'
      - '.github/workflows/python-scene-bundle-export.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-scene-bundle-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: target/portable
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Install pinned compiler and Python host
        run: |
          rustup show active-toolchain
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-bundle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Host ownership tests
        run: python -m unittest discover -s crates/fmn-python/tests -p 'test_bundle*protocol.py' -v
      - name: Real native recording and direct-versus-replayed pixels
        run: cargo test --locked -p fmn-python portal_studio -- --nocapture
      - name: Camera bundles through native workers and standalone CLI
        run: cargo test --locked -p fmn-conformance --test camera_bundle -- --nocapture
      - name: Native camera-rig export front door
        run: cargo test --locked -p fmn --test native_camera_export --test native_bundle_export -- --nocapture
      - name: Legacy bundle readers and camera-less player compatibility
        run: |
          cargo test --locked -p fmn-scene
          cargo test --locked -p fmn-wasm camera_tracks_refuse_at_load
      - name: Existing capture boundary regressions
        run: cargo test --locked -p fmn-python portal_recording -- --nocapture
      - name: Build the standalone consumer and matching installed wheel
        run: |
          cargo build --locked -p fmn-cli --features cli,batch
          maturin build --locked --profile dev --out "${RUNNER_TEMP}/bundle-wheels"
          python -m pip install --force-reinstall --no-deps "${RUNNER_TEMP}"/bundle-wheels/*.whl
      - name: Python console to standalone native replay
        env:
          FMN_TEST_BIN: ${{ github.workspace }}/target/portable/debug/fmn
        run: |
          python crates/fmn-python/tests/bundle_cli_native.py
          python crates/fmn-python/tests/camera_bundle_cli_native.py
          python crates/fmn-python/tests/camera_bundle_console.py
      - name: Check export sources without modifying the repository
        run: |
          rustfmt --edition 2024 --check --config skip_children=true crates/fmn-python/src/portal_studio/bundle.rs
          git diff --exit-code
