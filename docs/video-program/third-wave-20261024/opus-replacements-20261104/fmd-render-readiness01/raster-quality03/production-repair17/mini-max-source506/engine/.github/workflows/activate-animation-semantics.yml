name: Activate Animation semantics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-animation-semantics.yml"
      - "scripts/activate_animation_semantics.py"
      - "Cargo.lock"
  workflow_run:
    workflows: ["Complete fm-ai1 RNG Cutover"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activate-animation-semantics
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for the governed RNG lock closure
        id: ready
        shell: bash
        run: |
          if grep -Fq 'name = "fnp-random-core"' Cargo.lock; then
            echo "state=yes" >> "$GITHUB_OUTPUT"
          else
            echo "state=no" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock has not yet admitted fnp-random-core; activation remains deferred."
          fi

      - name: Install CPython 3.13
        if: steps.ready.outputs.state == 'yes'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.13"

      - name: Install the pinned Rust toolchain
        if: steps.ready.outputs.state == 'yes'
        run: rustup show active-toolchain

      - name: Cache Cargo state
        if: steps.ready.outputs.state == 'yes'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/animation-semantics
          key: animation-semantics-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install the exact Python dependency
        if: steps.ready.outputs.state == 'yes'
        run: python -m pip install --disable-pip-version-check numpy==2.5.2

      - name: Apply the integration transaction idempotently
        if: steps.ready.outputs.state == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/activate_animation_semantics.py
          first="$(git diff --binary | sha256sum | awk '{print $1}')"
          python scripts/activate_animation_semantics.py
          second="$(git diff --binary | sha256sum | awk '{print $1}')"
          [[ "$first" == "$second" ]]
          git diff --check

      - name: Validate Python installer and acceptance sources
        if: steps.ready.outputs.state == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/activate_animation_semantics.py \
            scripts/test_animation_semantics_installer.py \
            crates/fmn-python/python/manimlib/__init__.py \
            crates/fmn-python/python/manimlib/_animation_semantics.py \
            crates/fmn-python/tests/animation_semantics.py
          python scripts/test_animation_semantics_installer.py

      - name: Format and reject unrelated edits
        if: steps.ready.outputs.state == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(crates/fmn-python/python/manimlib/__init__\.py|crates/fmn-python/python/manimlib/_animation_semantics\.py|crates/fmn-python/src/lib\.rs|crates/fmn-python/tests/animation_semantics\.py|scripts/check\.sh|scripts/test_animation_semantics_installer\.py)$' || true)"
          [[ -z "$unexpected" ]] || {
            printf 'activation modified unrelated paths:\n%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Prove the direct extension and conformance surfaces
        if: steps.ready.outputs.state == 'yes'
        env:
          CARGO_TARGET_DIR: target/animation-semantics
        run: |
          cargo test --locked -p fmn-python
          cargo test --locked -p fmn-conformance

      - name: Commit the proven integration
        if: steps.ready.outputs.state == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FrankenManim Animation Semantics"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/fmn-python/python/manimlib/__init__.py \
            crates/fmn-python/python/manimlib/_animation_semantics.py \
            crates/fmn-python/src/lib.rs \
            crates/fmn-python/tests/animation_semantics.py \
            scripts/check.sh \
            scripts/test_animation_semantics_installer.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Animation semantic integration is already committed."
            exit 0
          fi
          git commit -m "feat(python): unify Animation semantics across portal entrypoints" \
            -m "Install one versioned idempotent continuation during native module bootstrap, exercise it through the permanent Rust acceptance harness, retain wheel re-import identity, and make the mandatory gate verify the installer contract."
          git pull --rebase origin main
          python scripts/activate_animation_semantics.py
          git diff --quiet
          git push origin HEAD:main
