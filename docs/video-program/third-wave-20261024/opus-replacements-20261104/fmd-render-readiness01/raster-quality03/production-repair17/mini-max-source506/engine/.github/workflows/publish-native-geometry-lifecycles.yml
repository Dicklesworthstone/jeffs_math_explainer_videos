name: Publish saved native geometry lifecycles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-native-geometry-lifecycles.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-native-geometry-lifecycles
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Dicklesworthstone/franken_manim' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.apply.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Recover the two exact saved mail patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          # Exact, previously tested source patches; not downloaded executable code.
          # Checksums bind this one-shot publication to the delivered archive.
          records = [{'name': '0001-fix-python-honor-native-arc-and-circle-subclass-init.patch', 'sha256': '46ce971cfdedd2da8ac92c5e7c11bff1571c186ce11e453b9f67b8da69ae7794', 'gzip_base64': ''}, {'name': '0002-fix-python-dispatch-polygon-and-line-subclass-geomet.patch', 'sha256': '622afb2ef6ac503d24fa5e39ad731c8434ec873fe476fc474727dcdd329c3f2a', 'gzip_base64': ''}]
          directory = Path(os.environ['RUNNER_TEMP']) / 'native-geometry-mail'
          directory.mkdir()
          for record in records:
              data = gzip.decompress(base64.b64decode(record['gzip_base64'], validate=True))
              assert hashlib.sha256(data).hexdigest() == record['sha256']
              (directory / record['name']).write_bytes(data)
              print(record['name'], record['sha256'])
          PYCODE
      - name: Apply and publish each feature batch without force pushing
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          export REPOSITORY_ROOT="$PWD"
          python3 - <<'PYCODE'
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['REPOSITORY_ROOT'])
          temporary = Path(os.environ['RUNNER_TEMP'])
          patches = sorted((temporary / 'native-geometry-mail').glob('*.patch'))
          assert len(patches) == 2
          allowed = [
              {
                  'crates/fmn-python/python/manimlib_bootstrap.py',
                  'crates/fmn-python/tests/native_geometry_lifecycle.py',
                  'scripts/check_portal_runtime.sh',
              },
              {
                  'crates/fmn-python/python/manimlib_bootstrap.py',
                  'crates/fmn-python/python/fmn_python/library_constructor_authority.py',
                  'crates/fmn-python/tests/native_polygon_lifecycle.py',
                  'scripts/check_portal_runtime.sh',
              },
          ]

          def run(*args, cwd=root, capture=False, check=True):
              return subprocess.run(args, cwd=cwd, check=check, text=True,
                                    stdout=subprocess.PIPE if capture else None)

          final_sha = None
          for index, patch in enumerate(patches):
              for attempt in range(1, 6):
                  run('git', 'fetch', 'origin', 'main')
                  work = temporary / f'native-lifecycle-{index + 1}-{attempt}'
                  run('git', 'worktree', 'add', '--detach', str(work), 'origin/main')
                  # Retried runs are harmless. Partial or conflicting changes
                  # fail the forward check instead of silently dropping edits.
                  reverse = run('git', 'apply', '--reverse', '--check', str(patch),
                                cwd=work, check=False)
                  if reverse.returncode == 0:
                      final_sha = run('git', 'rev-parse', 'HEAD', cwd=work, capture=True).stdout.strip()
                      print(f'Batch {index + 1} already present at {final_sha}', flush=True)
                      break
                  run('git', 'apply', '--check', str(patch), cwd=work)
                  run('git', '-c', 'commit.gpgsign=false', 'am', str(patch), cwd=work)
                  changed = set(run('git', 'diff-tree', '--no-commit-id', '--name-only',
                                    '-r', 'HEAD', cwd=work, capture=True).stdout.splitlines())
                  if changed != allowed[index]:
                      raise SystemExit(f'Unexpected changed paths: {changed}')
                  removed = run('git', 'diff', '--name-only', '--diff-filter=D',
                                'HEAD^', 'HEAD', cwd=work, capture=True).stdout.strip()
                  if removed:
                      raise SystemExit(f'File deletions are forbidden: {removed}')
                  run('git', 'diff', '--check', 'HEAD^', 'HEAD', cwd=work)
                  for path in sorted(changed):
                      if path.endswith('.py'):
                          compile((work / path).read_text(encoding='utf-8'), path, 'exec')
                  run('bash', '-n', 'scripts/check_portal_runtime.sh', cwd=work)
                  run('python3', 'scripts/test_python_helper_aliases.py', cwd=work)
                  # A fresh worktree on each retry preserves concurrent main
                  # changes. No reset, force push, deletion or PR is used.
                  pushed = run('git', 'push', 'origin', 'HEAD:refs/heads/main',
                               cwd=work, check=False)
                  if pushed.returncode == 0:
                      final_sha = run('git', 'rev-parse', 'HEAD', cwd=work, capture=True).stdout.strip()
                      title = run('git', 'log', '-1', '--format=%s', cwd=work, capture=True).stdout.strip()
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                          summary.write(f'Published to main: `{final_sha}` — {title}\n\n')
                      print(f'PUBLISHED_BATCH_{index + 1}={final_sha}', flush=True)
                      break
                  run('git', 'fetch', 'origin', 'main')
                  parent = run('git', 'rev-parse', 'HEAD^', cwd=work, capture=True).stdout.strip()
                  remote = run('git', 'rev-parse', 'origin/main', cwd=work, capture=True).stdout.strip()
                  if parent == remote:
                      raise SystemExit('Push failed without concurrent main advancement; refusing to bypass permissions')
              else:
                  raise SystemExit('Main kept advancing; no force push attempted')
          assert final_sha
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'source_sha={final_sha}\n')
          PYCODE
  native_validation:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Build a fresh native wheel and run lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/native-lifecycle-source-sha.txt
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
          python -m maturin build --locked --interpreter python --profile dev --out target/native-lifecycle-wheel 2>&1 | tee /tmp/native-lifecycle-build.log
          python -m venv target/native-lifecycle-venv
          target/native-lifecycle-venv/bin/python -m pip install 'numpy==2.5.2' target/native-lifecycle-wheel/*.whl
          for suite in native_geometry_lifecycle native_polygon_lifecycle copying_semantics animation_semantics movement_semantics rotation_semantics camera_animation_semantics creation_semantics configured_subdivision programmatic_rendering; do
            target/native-lifecycle-venv/bin/python -I "crates/fmn-python/tests/$suite.py" 2>&1 | tee "/tmp/native-lifecycle-$suite.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-lifecycle-validation-${{ github.run_id }}
          path: /tmp/native-lifecycle-*
          retention-days: 7
