[workspace]
resolver = "3"
members = [
    "crates/fmn-core",
    "crates/fmn-dmath",
    "crates/fmn-hash",
    "crates/fmn-config",
    "crates/fmn-platform",
    "crates/fmn-frame",
    "crates/fmn-codec",
    "crates/fmn-cache",
    "crates/fmn-geom",
    "crates/fmn-mobject",
    "crates/fmn-anim",
    "crates/fmn-render",
    "crates/fmn-text",
    "crates/fmn-tex",
    "crates/fmn-library",
    "crates/fmn-scene",
    "crates/fmn-studio",
    "crates/fmn-output",
    "crates/fmn-runtime",
    "crates/fmn",
    "crates/fmn-cli",
    "crates/fmn-conformance",
    "crates/fmn-wasm",
    "crates/fmn-python",
    "spikes/g0-1-object-model",
    "spikes/g0-3-fmd-math",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dicklesworthstone/franken_manim"

# The governed closure (D1): workspace-internal crates plus consumed
# FrankenSuite foundations (fnp, fsci, fmd-font, fmd-math, fnx, fp, ft,
# asupersync), each entering as a git dependency whose rev MUST equal its
# repo's SUITE.lock pin (governed_closure.rs enforces the equality); nothing
# else enters.
[workspace.dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "c48399f20a9780ef420de64fe504ff922e5afe5e", default-features = false }
fmd-font = { git = "https://github.com/Dicklesworthstone/franken_markdown", rev = "126a5304e8d94eaea62b1b8e13bbe9c40918ac72", features = ["bundled-faces"] }
fmd-math = { git = "https://github.com/Dicklesworthstone/franken_markdown", rev = "126a5304e8d94eaea62b1b8e13bbe9c40918ac72" }
fnp-dtype = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "a15d5c32e9330b555b0a653058bcfcff22fcb4ec" }
fnp-ndarray = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "a15d5c32e9330b555b0a653058bcfcff22fcb4ec" }
fnp-io = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "a15d5c32e9330b555b0a653058bcfcff22fcb4ec" }
fnp-random-core = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "a15d5c32e9330b555b0a653058bcfcff22fcb4ec" }
franken_markdown = { git = "https://github.com/Dicklesworthstone/franken_markdown", rev = "126a5304e8d94eaea62b1b8e13bbe9c40918ac72" }
fsci-integrate = { git = "https://github.com/Dicklesworthstone/frankenscipy", rev = "85edd7a99f2a6487ef35135e135b9959cc0010c1" }
fsci-linalg = { git = "https://github.com/Dicklesworthstone/frankenscipy", rev = "85edd7a99f2a6487ef35135e135b9959cc0010c1" }
fsci-opt = { git = "https://github.com/Dicklesworthstone/frankenscipy", rev = "85edd7a99f2a6487ef35135e135b9959cc0010c1" }
fnx-classes = { git = "https://github.com/Dicklesworthstone/franken_networkx", rev = "9d710b1c33e99412c94de7fa4de2f7ce4954110f" }
fp-types = { git = "https://github.com/Dicklesworthstone/frankenpandas", rev = "da85cf65df48965e027b2f5aa21b7d0ce6a7e29c", default-features = false }
fp-frame = { git = "https://github.com/Dicklesworthstone/frankenpandas", rev = "da85cf65df48965e027b2f5aa21b7d0ce6a7e29c", default-features = false }
ft-kernel-metal = { git = "https://github.com/Dicklesworthstone/frankentorch", rev = "523aaf827faf538aa541126ee222fcd7af348410" }
fmn-core = { path = "crates/fmn-core" }
fmn-dmath = { path = "crates/fmn-dmath" }
fmn-hash = { path = "crates/fmn-hash" }
fmn-config = { path = "crates/fmn-config" }
fmn-platform = { path = "crates/fmn-platform", default-features = false }
fmn-frame = { path = "crates/fmn-frame" }
fmn-codec = { path = "crates/fmn-codec" }
fmn-cache = { path = "crates/fmn-cache" }
fmn-geom = { path = "crates/fmn-geom" }
fmn-mobject = { path = "crates/fmn-mobject" }
fmn-anim = { path = "crates/fmn-anim" }
fmn-render = { path = "crates/fmn-render" }
fmn-text = { path = "crates/fmn-text" }
fmn-tex = { path = "crates/fmn-tex" }
fmn-library = { path = "crates/fmn-library" }
fmn-scene = { path = "crates/fmn-scene" }
fmn-studio = { path = "crates/fmn-studio" }
fmn-output = { path = "crates/fmn-output", default-features = false }
fmn-runtime = { path = "crates/fmn-runtime" }
fmn = { path = "crates/fmn" }
fmn-cli = { path = "crates/fmn-cli" }
fmn-conformance = { path = "crates/fmn-conformance" }
fmn-python = { path = "crates/fmn-python" }
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros"] }

[patch.crates-io]
# Patches do not propagate through git dependencies, so mirror
# frankentorch's exact reviewed fix for metal 0.33's block dependency here.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# Baseline: clippy::all at warn, promoted to errors by scripts/check.sh's
# `-D warnings`. Crates opt in via [lints] workspace = true.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Production-shaped symbols for the pinned performance rig (plan §17.2).
# Ordinary release artifacts keep their own policy; profiles and flame
# artifacts use this named profile so two runs cannot silently compare
# differently optimized binaries.
[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
