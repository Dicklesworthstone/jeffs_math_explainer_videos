name: Native coordinate placement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-coordinate-placement.yml"
      - "crates/fmn-library/src/coords/placement.rs"
      - "crates/fmn-library/src/planes/placement.rs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-coordinate-placement
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: never
  CARGO_TARGET_DIR: target/portable
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Install repository-pinned toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Wire the owning coordinate placement modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-coordinate-evidence
          git rev-parse HEAD | tee /tmp/native-coordinate-evidence/base-sha.txt
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          for name, visibility in (("coords", "pub(crate) "), ("planes", "")):
              path = Path(f"crates/fmn-library/src/{name}.rs")
              text = path.read_text()
              declaration = f"{visibility}mod placement;"
              if declaration not in text:
                  anchor = "\nuse fmn_core::"
                  if anchor not in text:
                      raise SystemExit(f"module anchor missing in {path}")
                  text = text.replace(anchor, f"\n{declaration}\n{anchor}", 1)
                  path.write_text(text)
          PY
          rustfmt --edition 2024 \
            crates/fmn-library/src/coords/placement.rs \
            crates/fmn-library/src/planes/placement.rs
          git diff --check
          git diff > /tmp/native-coordinate-evidence/candidate.patch
      - name: Execute native coordinate and library regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-library \
            2>&1 | tee /tmp/native-coordinate-evidence/library-tests.log
          cargo clippy --locked -p fmn-library --all-targets -- -D warnings \
            2>&1 | tee /tmp/native-coordinate-evidence/clippy.log
      - name: Publish the tested implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            crates/fmn-library/src/coords.rs
            crates/fmn-library/src/planes.rs
            crates/fmn-library/src/coords/placement.rs
            crates/fmn-library/src/planes/placement.rs
          )
          printf '%s\n' "${allowed[@]}" | sort > /tmp/coordinate-allowed
          git diff --name-only | sort > /tmp/coordinate-changed
          unexpected="$(comm -23 /tmp/coordinate-changed /tmp/coordinate-allowed)"
          [[ -z "$unexpected" ]] || { printf 'Unexpected changes: %s\n' "$unexpected"; exit 1; }
          git add -- "${allowed[@]}"
          git diff --cached --check
          git write-tree | tee /tmp/native-coordinate-evidence/tested-tree.txt
          if ! git diff --cached --quiet; then
            git fetch origin main
            [[ "$(git rev-parse FETCH_HEAD)" == "$BASE_SHA" ]] || {
              echo 'main moved during verification; refusing to overwrite concurrent work' >&2
              exit 1
            }
            git config user.name 'FrankenManim Native Implementation'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(coords): activate native chart placement after native regression checks' \
              -m 'Owning Axes, NumberPlane, ThreeDAxes, and ComplexPlane now move numeric endpoints, cached axis/grid views and the rendered family together. Native library tests and warning-denied clippy passed on this source tree. No forced push, PR, dependency change, or bead closure. Relates-to: fm-native-axes-reposition-n1yd.'
            git push origin HEAD:main
          fi
          git rev-parse HEAD | tee /tmp/native-coordinate-evidence/final-sha.txt
      - name: Retain native evidence and exact source
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p /tmp/native-coordinate-evidence
          git archive --format=tar.gz HEAD > /tmp/native-coordinate-evidence/source.tar.gz
          cp crates/fmn-library/src/coords/placement.rs /tmp/native-coordinate-evidence/coords-placement.rs
          cp crates/fmn-library/src/planes/placement.rs /tmp/native-coordinate-evidence/planes-placement.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: native-coordinate-evidence-${{ github.run_id }}
          path: /tmp/native-coordinate-evidence/
          if-no-files-found: error
          retention-days: 7
