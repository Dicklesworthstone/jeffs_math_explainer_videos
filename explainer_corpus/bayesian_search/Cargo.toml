[package]
name = "bayesian_search_explainer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "How to Find a Lost Submarine: Bayesian search from the USS Scorpion to the Coast Guard (a map of chances, searches that can miss, Bayes' rule after an empty search, and where to look next); a 3Blue1Brown-style explainer rendered by franken_manim"

[[bin]]
name = "search"
path = "src/main.rs"

# franken_manim's pin, its reviewed patches and the release profile come from
# the corpus workspace (the root Cargo.toml).
[dependencies]
fmn.workspace = true
explainer_kit.workspace = true
explainer_score.workspace = true
