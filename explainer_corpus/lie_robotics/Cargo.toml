[package]
name = "lie_robotics_explainer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Why Robot Arms Think in Lie Groups: turns that refuse to add, the exponential, screws, the product of exponentials for a KUKA LBR iiwa 14, its Jacobian, singularities and spare joint, and Newton's method on the group; a 3Blue1Brown-style explainer rendered by franken_manim"

[[bin]]
name = "lie"
path = "src/main.rs"

# franken_manim's pin, its reviewed patches and the release profile come from
# the corpus workspace (the root Cargo.toml).
[dependencies]
fmn.workspace = true
explainer_kit.workspace = true
explainer_score.workspace = true
