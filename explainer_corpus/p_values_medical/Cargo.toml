[package]
name = "p_values_medical_explainer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Why P-Values Confuse Even Doctors: a positive test counted in natural frequencies and a treatment study's null world counted in full; a 3Blue1Brown-style explainer rendered by franken_manim"

[[bin]]
name = "pvalues"
path = "src/main.rs"

# franken_manim's pin, its reviewed patches and the release profile come from
