[package]
name = "freivalds_explainer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Check a Giant Matrix Product Without Doing the Product Again: Freivalds' coin-toss check of A·B = C, its exact at-most-half bound and what independent repetition buys; a 3Blue1Brown-style explainer rendered by franken_manim"

[[bin]]
name = "freivalds"
path = "src/main.rs"

# franken_manim's pin, its reviewed patches and the release profile come from
# the corpus workspace (the root Cargo.toml).
[dependencies]
fmn.workspace = true
explainer_kit.workspace = true
explainer_score.workspace = true
