[package]
name = "square_packing_explainer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Why Turning a Square Can Make the Whole Box Smaller: five equal tiles, the turn that lets them fit a box 2 + 1/√2 wide, and the difference between a packing that fits and a proof that nothing smaller does; a 3Blue1Brown-style explainer rendered by franken_manim"

