[package]
name = "hoeffding_explainer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "A 3Blue1Brown-style explainer of Hoeffding's D, rendered end to end by franken_manim"

[[bin]]
name = "hoeffding"
path = "src/main.rs"

# franken_manim's pin, its reviewed `block` patch and the release profile come
# from the corpus workspace (the root Cargo.toml); this crate was standalone,
# with the same pin, until bead W3-migrate.
[dependencies]
fmn.workspace = true
explainer_kit.workspace = true
explainer_score.workspace = true
